document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min- -sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"fa570f04-6b0a-4e5f-90f6-acfa0934c584\"><\u002Fscript>\n<title>Lista 10 — Ângulos na circunferência | 1º ano<\u002Ftitle>\n<style>\n  :root {\n    --color-accent: #309898;\n    --color-accent-100: #e6f2f2;\n    --color-accent-200: #c7e5e4;\n    --color-accent-300: #9fd2d1;\n    --color-accent-400: #63b5b4;\n    --color-accent-500: #309898;\n    --color-accent-600: #2a8686;\n    --color-accent-700: #1f6a6b;\n    --color-accent-800: #17504f;\n    --color-accent-900: #0f3737;\n    --color-accent-2: #309898;\n    --color-accent-2-500: #309898;\n    --color-accent-2-700: #1f6a6b;\n  }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); }\n  ::selection { background: var(--color-accent-200); }\n  video { display: block; width: 100%; height: auto; background: var(--color-neutral-900) }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"max-width: 1000px; margin: 0 auto; padding: clamp(24px, 5vw, 56px) clamp(18px, 5vw, 56px) 88px; font-family: var(--font-body); font-size: 19px; line-height: 1.55; text-wrap: pretty\">\n\n  <header style=\"display: flex; flex-direction: column; gap: 22px; border-bottom: 2px solid var(--color-divider); padding-bottom: 32px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px\">\n      <div style=\"display: flex; align-items: center; gap: 18px\">\n        <img src=\"4eeca98e-d13e-4746-9133-f6c01f3d25eb\" alt=\"Arena — Educação Infantil e Ensino Fundamental\" style=\"width: 64px; height: 64px; display: block\">\n        <div style=\"line-height: 1.25\">\n          <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; letter-spacing: -0.01em\">Arena<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--color-neutral-700)\">Ensino Médio<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"index.html\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 2px solid var(--color-divider); font-size: 16px; font-weight: 600; color: var(--color-accent-700)\">Todas as listas<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">\n      <span>Lista 10 · M.P. V (Matemática)<\u002Fspan>\n      <span style=\"color: var(--color-neutral-700)\">Prof. Rodolfo Pinheiro<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 9vw, 66px); line-height: 0.99; letter-spacing: -0.025em; margin: 0; margin-left: -0.05em\">Ângulos na circunferência<\u002Fh1>\n    <p style=\"margin: 0; font-size: clamp(18px, 4.4vw, 22px); line-height: 1.35; max-width: 46ch\">Resolva na lista impressa ou no caderno. Aqui você confere — mas peça um passo de cada vez, não a resposta pronta.<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"margin-top: 40px; border: 2px solid var(--color-divider); padding: clamp(20px, 4vw, 30px)\">\n    <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">Antes de começar<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 5.5vw, 32px); line-height: 1.1; letter-spacing: -0.02em; margin: 12px 0 0\">Cinco ângulos, cinco regras<\u002Fh2>\n    <p style=\"margin: 14px 0 0; font-size: 18px; line-height: 1.5; max-width: 66ch\">Todo ângulo desta lista se mede pelo <strong style=\"font-weight: 600\">arco<\u002Fstrong> que ele enxerga. O que muda é onde fica o vértice: no centro, na circunferência, dentro ou fora dela.<\u002Fp>\n\n    <div style=\"margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 26px 32px\">\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; margin: 0; line-height: 1.15\">Central<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 17px; line-height: 1.45\">Vértice no centro. Vale exatamente o arco.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px\">ângulo = arco<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; margin: 0; line-height: 1.15\">Inscrito<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 17px; line-height: 1.45\">Vértice na circunferência, dois lados cortando-a. Vale metade do arco.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px\">ângulo = arco ÷ 2<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; margin: 0; line-height: 1.15\">De segmento<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 17px; line-height: 1.45\">Entre uma tangente e uma corda que saem do mesmo ponto. Também metade do arco.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px\">ângulo = arco ÷ 2<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; margin: 0; line-height: 1.15\">Excêntrico interno<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 17px; line-height: 1.45\">Vértice dentro, onde duas cordas se cruzam. Média dos dois arcos que ele enxerga.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px\">ângulo = (arco + arco) ÷ 2<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 20px; margin: 0; line-height: 1.15\">Excêntrico externo<\u002Fh3>\n        <p style=\"margin: 10px 0 0; font-size: 17px; line-height: 1.45\">Vértice fora, com secantes ou tangentes. Metade da <em>diferença<\u002Fem> dos arcos.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px\">ângulo = (arco − arco) ÷ 2<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 26px 0 0; font-size: 18px; background: var(--color-accent-100); color: var(--color-accent-900); padding: 18px 22px; max-width: 78ch\"><strong style=\"font-weight: 600\">Três consequências que resolvem meia lista:<\u002Fstrong> todo ângulo inscrito num semicírculo é reto; dois ângulos inscritos que enxergam o mesmo arco são iguais; e a volta inteira fecha em 360°.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"margin-top: 40px; border: 2px solid var(--color-divider); padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px\">\n    <div style=\"flex: 1; min-width: 220px\">\n      <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Seu progresso<\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15\">{{ progressoTexto }}<\u002Fp>\n      <div style=\"margin-top: 12px; height: 16px; background: var(--color-neutral-200)\"><div style=\"{{ barraProgresso }}\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn btn-ghost\" style=\"font-size: 16px; color: var(--color-accent-700); min-height: 48px\" sc-camel-on-click=\"{{ limpar }}\">Limpar minhas marcações<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 44px; display: flex; flex-direction: column; gap: 56px\">\n    <sc-for list=\"{{ questoes }}\" as=\"q\" hint-placeholder-count=\"17\">\n      <article style=\"{{ q.moldura }}\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px\">\n          <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; color: var(--color-accent-700)\">{{ q.n }}<\u002Fspan>\n          <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">{{ q.assunto }}<\u002Fspan>\n          <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">{{ q.origem }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <p style=\"margin: 16px 0 0; font-size: clamp(18px, 4.4vw, 20px); line-height: 1.5; max-width: 68ch\">{{ q.enunciado }}<\u002Fp>\n\n        <sc-if value=\"{{ q.temFigura }}\" hint-placeholder-val=\"{{ false }}\">\n          <figure style=\"margin: 22px 0 0; border: 2px solid var(--color-divider); padding: 16px; background: #ffffff\">\n            <img src=\"{{ q.figura }}\" alt=\"{{ q.figuraAlt }}\" style=\"display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto\">\n          <\u002Ffigure>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ q.temAlternativas }}\" hint-placeholder-val=\"{{ false }}\">\n          <ul style=\"margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 28px; max-width: 64ch\">\n            <sc-for list=\"{{ q.alternativas }}\" as=\"alt\" hint-placeholder-count=\"4\">\n              <li style=\"font-size: 18px; line-height: 1.45\">{{ alt.texto }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 20px\">\n          <div style=\"flex: 1; min-width: 220px\">\n            <label for=\"{{ q.idCampo }}\" style=\"display: block; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Sua resposta<\u002Flabel>\n            <input class=\"input\" id=\"{{ q.idCampo }}\" type=\"text\" value=\"{{ q.resposta }}\" sc-camel-on-change=\"{{ q.anotar }}\" placeholder=\"anote aqui antes de conferir\" style=\"margin-top: 8px; width: 100%; min-height: 52px; font-size: 18px\">\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 20px\" sc-camel-on-click=\"{{ q.marcar }}\">{{ q.rotuloFeita }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 24px; border-top: 2px solid var(--color-divider); padding-top: 20px\">\n          <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">Resolução<\u002Fdiv>\n\n          <sc-if value=\"{{ q.semResolucao }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 12px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 62ch\">{{ q.avisoPendente }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ q.nadaAberto }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin: 12px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 62ch\">Tentou de verdade? Então peça uma dica de cada vez — é assim que a resolução ensina alguma coisa.<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ q.passosVisiveis }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <div style=\"margin-top: 18px; display: flex; gap: 16px; align-items: baseline\">\n              <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 16px; color: var(--color-accent-700); flex: none\">{{ p.n }}<\u002Fspan>\n              <p style=\"margin: 0; font-size: 18px; line-height: 1.5; max-width: 66ch\">{{ p.texto }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ q.terminou }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 20px 0 0; font-size: 18px; font-weight: 600; background: var(--color-accent-100); color: var(--color-accent-900); padding: 16px 20px; max-width: 66ch\">Resposta: {{ q.gabarito }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px\">\n            <sc-if value=\"{{ q.temMaisPassos }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-primary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ q.umPasso }}\">{{ q.rotuloPasso }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ q.temMaisPassos }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ q.tudo }}\">Ver resolução completa<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ q.terminou }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"btn btn-ghost\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px; color: var(--color-accent-700)\" sc-camel-on-click=\"{{ q.esconder }}\">Esconder de novo<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ q.mostrarExtras }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 24px; display: flex; flex-direction: column; gap: 20px\">\n              <sc-if value=\"{{ q.temVideo }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Resolução em vídeo<\u002Fdiv>\n                  <figure style=\"margin: 12px 0 0; border: 2px solid var(--color-text)\">\n                    <video controls=\"\" preload=\"none\" playsinline=\"\" src=\"{{ q.video }}\"><\u002Fvideo>\n                  <\u002Ffigure>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ q.temFoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Resolução no papel<\u002Fdiv>\n                  <figure style=\"margin: 12px 0 0; border: 2px solid var(--color-divider); padding: 12px; background: #ffffff\">\n                    <img src=\"{{ q.foto }}\" alt=\"Resolução manuscrita da questão {{ q.n }}\" style=\"display: block; width: 100%; height: auto\">\n                  <\u002Ffigure>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <section style=\"margin-top: 72px; border-top: 2px solid var(--color-text); padding-top: 28px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px 24px\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.1; letter-spacing: -0.02em; margin: 0\">Gabarito<\u002Fh2>\n      <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ alternarGabarito }}\">{{ rotuloGabarito }}<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin: 14px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 60ch\">Só as respostas finais, para conferir de uma vez. As resoluções ficam em cada questão.<\u002Fp>\n\n    <sc-if value=\"{{ gabaritoAberto }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-raw-table class=\"table\" style=\"margin-top: 24px; max-width: 700px; font-size: 18px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Questão<\u002Fsc-raw-th><sc-raw-th>Resposta<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ questoes }}\" as=\"q\" hint-placeholder-count=\"10\">\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600\">{{ q.n }}<\u002Fsc-raw-td><sc-raw-td>{{ q.gabarito }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <footer style=\"margin-top: 72px; border-top: 2px solid var(--color-divider); padding-top: 28px; font-size: 16px; color: var(--color-neutral-700)\">\n    <p style=\"margin: 0\">Material produzido pelo <strong style=\"font-weight: 600\">Prof. Rodolfo C Pinheiro<\u002Fstrong> para a Arena — Educação Infantil e Ensino Fundamental.<\u002Fp>\n    <p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5\">Questões autorais e adaptadas de Ufes e FGV; a origem está indicada em cada uma. Suas anotações ficam salvas apenas neste aparelho.<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\n/* ─────────────────────────────────────────────────────────────────────────\n   LISTA 11 — POTÊNCIA DE PONTO\n\n   Campos de cada questão: numero, assunto, origem, enunciado, figura,\n   figuraAlt, alternativas, passos, gabarito, video, foto.\n   Deixe `passos` vazio ([]) para publicar sem resolução, com um `pendente`.\n   ───────────────────────────────────────────────────────────────────────── */\n\nconst LISTA = \"lista-10-angulos-na-circunferencia\";\n\n/* ─────────────────────────────────────────────────────────────────────────\n   FIGURAS EMBUTIDAS\n\n   As imagens das questões estão gravadas aqui dentro, em texto. É por isso\n   que a lista funciona sem nenhum arquivo de imagem ao lado: basta subir\n   este HTML. Não edite este bloco à mão — peça a troca de uma figura e ela\n   é regerada.\n   ───────────────────────────────────────────────────────────────────────── */\nconst FIGURAS = {\n  \"fig-l10-q10.png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAScAAAENCAYAAABNbaMRAAAQAElEQVR4AezdCZxlR1U/8Po1f/ctLgguaBAREMEouKFIQkBAUAc3goCZKCKCmKCAgEIgAooECPsmEPYd2fclIDuyL0pYTNhUFEUUUET4v2/dnJ43w0x3Z7pfv6Vvf+ZM1b231lPnnDp16lS9tS+NfyMGZoyBL37xi1/6v//7vy9t9Pe///u//fNnPvOZHtZ/X/ziF7/0xS8eGSrdGK4eBtba+DdiYBcwsLZ2MKlNWKmBqvr//b//16P17otf/GJ/Hv/buxg4mGL2Lh7Gns8IA4RMkvXSCR/vhKA+TDSrHv2Kr/iKHiYH8vQX4397DgOjcNpzQ350HT7aXNMCiFAqIUSTAt6BybKu+faVX/mVvarpfP3F+N+ew8AonPbckO9uh5MDGhDhQ+gQStUKcfDVX/3V7SIXuUh//YUvfKH9z//8T4+P/+1dDIzCae+O/a72nFAC05USQP/6r//a/uM//qPDv/3bv/XPtKjkgFDrL8f/9hwGRuG054Z8dztcAilJoyGVdvTf//3f7d///d/bk5/85PbABz6w3fve9+7xf/mXf2mWdl/1VV/Vxr8lxMAONnkUTjuIzLGoL8dACSdfCCcgTjh9+tOfbn/1V3/VzjjjjPZnf/Zn7RGPeET70Ic+1Jd3SdpnP/tZSUfYoxgYhdMeHfjd6nYJI/V9/vOfXxc47E/nnXdeN4J//dd/fbvYxS7WNatPfepT7WMf+5jkXUj1yPjfnsTAKJz25LDvXqcJp8997nPtv/7rvxqj99d+7dd2gfSSl7yk3ete9+q2pl/91V9tv/Zrv9bOPffcduaZZ7Y3vOENvYHj0q6jYc/+NwqnVR76BekbocSOpDk0JsLq/e9/f3v5y1/euBH87M/+bLv61a/ekrRXvepV7e/+7u8ao7j0I+xdDIzCae+O/a703I5ckm7kViE7kmXcN37jN3Zh9JnPfKZxHWCD4iXORvV1X/d1fYkn/Qh7FwNre7frY893AwPJ4BJAYyJ4vuEbvqEv8ezU2bkjpAglQozQkk6ce8FutG+sY3ExMAqnxR2blWhZLecs35I0mhL3AUu6b/mWb2m/+Zu/2a585Su3K13pSu0mN7lJ+87v/M72ghe8oD3xiU8cHTF3jQIWs6JROC3muKxcq5yZoxVxH3jOc57T3vKWt7Tv+I7vaL/0S7/ULn3pS7fLXvayjWH8Epe4RPubv/mb9uxnP3sUTitHBReuQ2sXLvmYesTAhcMA9wHLObloT9/8zd+8bmMirCzhpLGbxx71n//5n5J2mxNDen8Y/9uTGBiF054c9t3rNIGUpLsPJOle4bUT9w//8A/t93//99sNbnCD9ou/+IvttNNOax//+Md74+TjLS5M0o3nBJmdvmR4T o centro, e o de 2x tem vértice na circunferência.\",\n      \"Quando isso acontece, o inscrito vale metade do central: 2x = 110 ÷ 2.\",\n      \"2x = 55, portanto x = 27,5°.\"\n    ],\n    gabarito: \"x = 27,5°\"\n  },\n  {\n    numero: \"1b\", assunto: \"Inscritos no mesmo arco\", origem: \"Autoral\",\n    enunciado: \"Determine o valor de x, sabendo que O é o centro da circunferência.\",\n    figura: \"fig-l10-q1b.png\", figuraAlt: \"Circunferência com diâmetro CD, ângulo de 10° em A e ângulo 4x em D\",\n    passos: [\n      \"Os dois ângulos marcados têm vértice na circunferência: o de 10°, em A, e o de 4x, em D.\",\n      \"Verifique o que cada um enxerga: os dois olham para o mesmo arco BC.\",\n      \"Ângulos inscritos que enxergam o mesmo arco são iguais. Então 4x = 10.\",\n      \"x = 2,5°.\"\n    ],\n    gabarito: \"x = 2,5°\"\n  },\n  {\n    numero: \"1c\", assunto: \"Triângulo isósceles no centro\", origem: \"Autoral\",\n    enunciado: \"Determine o valor de x, sabendo que O é o centro da circunferência.\",\n    figura: \"fig-l10-q1c.png\", figuraAlt: \"Circunferência de centro O com ângulo inscrito de 40° em A e ângulo x no triângulo OBC\",\n    passos: [\n      \"O ângulo de 40° em A é inscrito e enxerga o arco BC. Logo o arco BC mede o dobro: 80°.\",\n      \"O ângulo central BÔC enxerga esse mesmo arco, então BÔC = 80°.\",\n      \"Agora olhe o triângulo OBC. Os lados OB e OC são raios, portanto são iguais e o triângulo é isósceles.\",\n      \"Num isósceles os dois ângulos da base são iguais: x = (180 − 80) ÷ 2.\",\n      \"x = 100 ÷ 2 = 50°.\"\n    ],\n    gabarito: \"x = 50°\"\n  },\n  {\n    numero: \"2\", assunto: \"Cadeia de isósceles\", origem: \"Autoral\",\n    enunciado: \"Sabendo que os pontos B e C são centros das circunferências, determine o valor do ângulo x.\",\n    figura: \"fig-l10-q2.png\", figuraAlt: \"Duas circunferências de centros B e C, com A, B, C e D alinhados e um ponto de encontro no alto\",\n    passos: [\n      \"Chame de E o ponto em que as duas circunferências se encontram, lá em cima. Todos os segmentos que vão de um centro até a sua circunferência são raios — é dessa igualdade que sai tudo.\",\n      \"No triângulo ABE, os lados BA e BE são raios da circunferência de centro B, então ele é isósceles: o ângulo em E também vale x.\",\n      \"O ângulo externo do triângulo em B vale a soma dos dois internos não adjacentes: EB̂C = x + x = 2x.\",\n      \"Passe para o triângulo BCE. Agora CB e CE são raios da circunferência de centro C, então esse triângulo também é isósceles, com o vértice em C: os ângulos em B e em E valem 2x cada.\",\n      \"De novo o ângulo externo, agora em C: EĈD = 2x + 2x = 4x.\",\n      \"A figura dá esse ângulo: 4x = 80, portanto x = 20°.\"\n    ],\n    gabarito: \"x = 20°\"\n  },\n  {\n    numero: \"3\", assunto: \"Arcos\", origem: \"Autoral\",\n    enunciado: \"Na figura está representada uma circunferência de centro O em que A, B, C e D são pontos da circunferência, DÂB = 50° e DÔC = 60°. Qual é, em graus, a amplitude do arco menor CB?\",\n    figura: \"fig-l10-q3.png\", figuraAlt: \"Circunferência de centro O com ângulo inscrito de 50° em A e ângulo central de 60°\",\n    passos: [\n      \"Transforme cada ângulo em arco — é a moeda comum do problema.\",\n      \"DÂB = 50° é inscrito e enxerga o arco DB que não contém A. Esse arco vale o dobro: 100°.\",\n      \"Esse arco DB é formado por dois pedaços emendados: o arco DC e o arco CB.\",\n      \"DÔC = 60° é central, então o arco DC vale 60°.\",\n      \"Sobra: arco CB = 100 − 60 = 40°.\"\n    ],\n    gabarito: \"40°\"\n  },\n  {\n    numero: \"4\", assunto: \"Triângulo no centro\", origem: \"Autoral\",\n    enunciado: \"Na figura estão representados uma circunferência de centro O, o triângulo ABC inscrito na circunferência e o triângulo OAC. A amplitude do ângulo OÂC é 28°. Determine a amplitude, em graus, do ângulo CBA.\",\n    figura: \"fig-l10-q4.png\", figuraAlt: \"Circunferência de centro O com o triângulo inscrito ABC e o triângulo OAC\",\n    passos: [\n      \"Comece pelo triângulo OAC. Os lados OA e OC são raios, então ele é isósceles e o ângulo em C também mede 28°.\",\n      \"A soma dos ângulos de um triângulo é 180°, então AÔC = 180 − 28 − 28 = 124°.\",\n      \"AÔC é um ângulo central, logo o arco AC mede 124°.\",\n      \"O ângulo CBA tem vértice em B, na circunferência, e enxerga esse mesmo arco AC: é inscrito.\",\n      \"Inscrito é metade do arco: CBA = 124 ÷ 2 = 62°.\"\n    ],\n    gabarito: \"62°\"\n  },\n  {\n    numero: \"5\", assunto: \"Ângulo em semicírculo\", origem: \"Autoral\",\n    enunciado: \"Na figura, os vértices A, B e C são pontos da circunferência λ de centro O. Se AB é um diâmetro de λ, determine a medida θ, em graus, indicada na figura.\",\n    figura: \"fig-l10-q5.png\", figuraAlt: \"Circunferência de centro O com o diâmetro AB, ângulo de 32° em A e ângulo θ em C\",\n    passos: [\n      \"AB é diâmetro, e existe uma regra de ouro para isso: todo ângulo inscrito que se apoia num diâmetro é reto. Então AĈB = 90°.\",\n      \"No triângulo ABC já temos dois ângulos: 32° em A e 90° em C. O terceiro é AB̂C = 180 − 32 − 90 = 58°.\",\n      \"Agora olhe o triângulo OCB. Os lados OC e OB são raios, então ele é isósceles.\",\n      \"Num isósceles os ângulos da base são iguais: θ = OB̂C = 58°.\"\n    ],\n    gabarito: \"θ = 58°\"\n  },\n  {\n    numero: \"6\", assunto: \"Diâmetro e arcos\", origem: \"Autoral\",\n    enunciado: \"Na figura, A, B, C e D são pontos da circunferência de centro O, sendo AB um diâmetro. Conhecidas as medidas angulares dos arcos indicados na figura, determine, em graus, a soma α + β + θ.\",\n    figura: \"fig-l10-q6.png\", figuraAlt: \"Circunferência de centro O com diâmetro AB, arco de 134° e arco de 82°, e os ângulos α, β e θ\",\n    passos: [\n      \"AB é diâmetro, então ele parte a circunferência em duas metades de 180° cada. Trabalhe uma metade de cada vez.\",\n      \"Na metade da direita ficam os arcos BD (134°) e DA. Então o arco DA = 180 − 134 = 46°.\",\n      \"Na metade da esquerda ficam os arcos AC (82°) e CB. Então o arco CB = 180 − 82 = 98°.\",\n      \"β é central e enxerga o arco DA: β = 46°.\",\n      \"θ é inscrito, com vértice em B, e enxerga o mesmo arco DA: θ = 46 ÷ 2 = 23°.\",\n      \"α é inscrito, com vértice em A, e enxerga o arco CB: α = 98 ÷ 2 = 49°.\",\n      \"A soma pedida: 49 + 46 + 23 = 118°.\"\n    ],\n    gabarito: \"α = 49°, β = 46°, θ = 23° — soma 118°\"\n  },\n  {\n    numero: \"7a\", assunto: \"Excêntrico interno\", origem: \"Autoral\",\n    enunciado: \"Determine o valor de α, sabendo que os arcos EFA e BCD medem, respectivamente, 112° e 86°.\",\n    figura: \"fig-l10-q7a.png\", figuraAlt: \"Duas cordas que se cruzam dentro da circunferência formando o ângulo α\",\n    passos: [\n      \"O vértice do ângulo está dentro da circunferência, no cruzamento de duas cordas: é um ângulo excêntrico interno.\",\n      \"Esse ângulo enxerga dois arcos ao mesmo tempo — o que está na sua frente e o que está atrás dele — e vale a média dos dois.\",\n      \"α = (112 + 86) ÷ 2.\",\n      \"α = 198 ÷ 2 = 99°.\"\n    ],\n    gabarito: \"α = 99°\"\n  },\n  {\n    numero: \"7b\", assunto: \"Excêntrico externo\", origem: \"Autoral\",\n    enunciado: \"Determine o valor de α no caso em que o vértice está fora da circunferência, com os arcos indicados na figura.\",\n    figura: \"fig-l10-q7b.png\", figuraAlt: \"Duas secantes traçadas de um ponto externo, com arcos de 32° e 130°\",\n    passos: [\n      \"Agora o vértice está fora e as duas retas cortam a circunferência: é um ângulo excêntrico externo.\",\n      \"A regra muda de sinal: em vez de somar os arcos, subtraia — sempre o maior menos o menor — e divida por dois.\",\n      \"α = (130 − 32) ÷ 2.\",\n      \"α = 98 ÷ 2 = 49°.\"\n    ],\n    gabarito: \"α = 49°\"\n  },\n  {\n    numero: \"8\", assunto: \"Os cinco tipos juntos\", origem: \"Autoral\",\n    enunciado: \"Na figura, com bastante atenção, determine o valor dos ângulos representados pelas letras α, β, γ, δ e ε. São dados os arcos AB = 60° e ED = 30°.\",\n    figura: \"fig-l10-q8.png\", figuraAlt: \"Circunferência com ângulos α no centro, β e γ na circunferência, δ dentro e ε fora\",\n    passos: [\n      \"Esta questão é um resumo da lista: cada letra é um tipo diferente de ângulo. Antes de calcular, identifique onde está cada vértice.\",\n      \"α tem vértice em O, o centro. É central, então vale o próprio arco AB: α = 60°.\",\n      \"β tem vértice em C, na circunferência, e enxerga o arco AB. É inscrito: β = 60 ÷ 2 = 30°.\",\n      \"γ está entre a tangente que passa por A e a corda AB. É ângulo de segmento, e também vale metade do arco: γ = 30°.\",\n      \"δ tem vértice em F, dentro da circunferência, no cruzamento de duas cordas. É excêntrico interno, a média dos dois arcos: δ = (60 + 30) ÷ 2 = 45°.\",\n      \"ε tem vértice em P, fora. É excêntrico externo, metade da diferença: ε = (60 − 30) ÷ 2 = 15°.\",\n      \"Repare no padrão: com os mesmos dois arcos, o vértice foi andando do centro para fora e o ângulo foi encolhendo.\"\n    ],\n    gabarito: \"α = 60°, β = 30°, γ = 30°, δ = 45°, ε = 15°\"\n  },\n  {\n    numero: \"9\", assunto: \"Excêntrico interno\", origem: \"Autoral\",\n    enunciado: \"Na figura está representada uma semicircunferência de diâmetro AB. Os pontos C e D pertencem à semicircunferência, o ponto E é a intersecção dos segmentos AC e BD, e AÊD = 70°. Determine a amplitude do arco DC.\",\n    figura: \"fig-l10-q9.png\", figuraAlt: \"Semicircunferência de diâmetro AB com os segmentos AC e BD cruzando-se em E\",\n    passos: [\n      \"E está dentro da circunferência, no cruzamento das cordas AC e BD: ângulo excêntrico interno.\",\n      \"O ângulo AÊD enxerga dois arcos: o arco AD e o arco CB, que ficam em lados opostos do cruzamento.\",\n      \"Pela regra do excêntrico interno: (arco AD + arco CB) ÷ 2 = 70, logo arco AD + arco CB = 140°.\",\n      \"Agora use o diâmetro: de A até B, passando por D e C, tem-se meia volta, ou seja, 180°.\",\n      \"Esse caminho é arco AD + arco DC + arco CB = 180. Substituindo: 140 + arco DC = 180.\",\n      \"Arco DC = 40°.\"\n    ],\n    gabarito: \"40°\"\n  },\n  {\n    numero: \"10\", assunto: \"Bissetriz e cordas iguais\", origem: \"Ufes\",\n    enunciado: \"Na figura, A, B, C e D são pontos de uma circunferência, a corda CD é bissetriz do ângulo ACB e as cordas AB e AC têm o mesmo comprimento. Se o ângulo BÂD mede 40°, a medida α do ângulo BÂC é\",\n    figura: \"fig-l10-q10.png\", figuraAlt: \"Circunferência com os pontos A, B, C e D e as cordas indicadas\",\n    alternativas: [\"a) 10°\", \"b) 15°\", \"c) 20°\", \"d) 25°\", \"e) 30°\"],\n    passos: [\n      \"Traduza cada informação para arcos — é onde as três condições conversam entre si.\",\n      \"BÂD = 40° é inscrito e enxerga o arco BD: então arco BD = 80°.\",\n      \"CD é bissetriz de AĈB, ou seja, corta esse ângulo em duas partes iguais. Ângulos inscritos iguais enxergam arcos iguais, então arco AD = arco DB = 80°.\",\n      \"As cordas AB e AC têm o mesmo comprimento, e cordas iguais correspondem a arcos iguais: arco AB = arco AC.\",\n      \"O arco AB é o caminho de A até B passando por D: 80 + 80 = 160°. Logo o arco AC também mede 160°.\",\n      \"A volta inteira fecha em 360°: 80 (AD) + 80 (DB) + arco BC + 160 (CA) = 360, portanto arco BC = 40°.\",\n      \"α = BÂC é inscrito e enxerga o arco BC: α = 40 ÷ 2 = 20°.\"\n    ],\n    gabarito: \"c) 20°\"\n  },\n  {\n    numero: \"11\", assunto: \"Ângulo entre tangentes\", origem: \"Ufes\",\n    enunciado: \"Na figura, os segmentos de reta AP e DP são tangentes à circunferência, o arco ABC mede 110 graus e o ângulo CAD mede 45 graus. A medida, em graus, do ângulo APD é\",\n    figura: \"fig-l10-q11.png\", figuraAlt: \"Circunferência com duas tangentes traçadas do ponto P externo\",\n    alternativas: [\"a) 15\", \"b) 20\", \"c) 25\", \"d) 30\", \"e) 35\"],\n    passos: [\n      \"As tangentes tocam a circunferência em A e em D. O ângulo em P vai depender só dos arcos entre esses dois pontos, então o trabalho é descobrir quanto mede cada um.\",\n      \"O arco ABC já foi dado: 110°.\",\n      \"CÂD = 45° é inscrito e enxerga o arco CD: então arco CD = 90°.\",\n      \"A volta fecha em 360°, então o arco que vai de D direto até A mede 360 − 110 − 90 = 160°.\",\n      \"O outro caminho de A até D, passando por B e C, mede 110 + 90 = 200°.\",\n      \"O ângulo entre duas tangentes é metade da diferença dos dois arcos: APD = (200 − 160) ÷ 2.\",\n      \"APD = 40 ÷ 2 = 20°.\"\n    ],\n    gabarito: \"b) 20°\"\n  },\n  {\n    numero: \"12\", assunto: \"Tangentes e inscrito\", origem: \"Autoral\",\n    enunciado: \"Determine o valor do ângulo representado por α na figura, sabendo que o ponto O é o centro da circunferência.\",\n    figura: \"fig-l10-q12.png\", figuraAlt: \"Duas tangentes formando 56° e um ângulo inscrito α do outro lado da circunferência\",\n    passos: [\n      \"As duas retas que saem do vértice da esquerda são tangentes, e o raio sempre chega perpendicular ao ponto de tangência — é o que os quadradinhos indicam.\",\n      \"Junte o vértice da esquerda, os dois pontos de tangência e o centro O: eles formam um quadrilátero.\",\n      \"A soma dos ângulos de um quadrilátero é 360°. Dois deles são retos e um é o de 56°.\",\n      \"O ângulo no centro vale 360 − 90 − 90 − 56 = 124°. Como é central, o arco entre os dois pontos de tangência também mede 124°.\",\n      \"α tem vértice na circunferência e enxerga esse mesmo arco: é inscrito.\",\n      \"α = 124 ÷ 2 = 62°.\"\n    ],\n    gabarito: \"α = 62°\"\n  },\n  {\n    numero: \"13\", assunto: \"Tangentes e arcos iguais\", origem: \"FGV\",\n    enunciado: \"Na figura, AB e AE são tangentes à circunferência nos pontos B e E, respectivamente, e BÂE = 60°. Se os arcos BPC, CQD e DRE têm medidas iguais, a medida do ângulo BÊC, indicado por α, é igual a\",\n    figura: \"fig-l10-q13.png\", figuraAlt: \"Circunferência com duas tangentes formando 60° no ponto A e três arcos iguais\",\n    alternativas: [\"a) 20°\", \"b) 40°\", \"c) 45°\", \"d) 60°\", \"e) 80°\"],\n    passos: [\n      \"Os pontos de tangência são B e E, e eles dividem a circunferência em dois arcos: o menor, virado para A, e o maior, do outro lado.\",\n      \"Chame o menor de m. O maior é 360 − m, porque a volta fecha em 360°.\",\n      \"O ângulo entre duas tangentes é metade da diferença: 60 = [(360 − m) − m] ÷ 2, ou seja, 120 = 360 − 2m.\",\n      \"2m = 240, portanto m = 120° e o arco maior mede 240°.\",\n      \"É no arco maior que ficam C e D, partindo-o em três pedaços iguais: cada um mede 240 ÷ 3 = 80°.\",\n      \"α = BÊC é inscrito, com vértice em E, e enxerga o arco BC, que é um desses pedaços de 80°.\",\n      \"α = 80 ÷ 2 = 40°.\"\n    ],\n    gabarito: \"b) 40°\"\n  },\n  {\n    numero: \"14\", assunto: \"Polígonos inscritos\", origem: \"FGV\",\n    enunciado: \"As cordas AB e CD de uma circunferência de centro O são, respectivamente, lados de polígonos regulares de 6 e 10 lados inscritos nessa circunferência. Na mesma circunferência, as cordas AD e BC se intersectam no ponto P. Determine a medida do ângulo BPD, indicado na figura por α.\",\n    figura: \"fig-l10-q14.png\", figuraAlt: \"Circunferência com as cordas AD e BC cruzando-se no ponto P\",\n    passos: [\n      \"Um polígono regular inscrito reparte a circunferência em arcos iguais — um para cada lado. É daí que saem as medidas.\",\n      \"O hexágono tem 6 lados, então cada lado enxerga um arco de 360 ÷ 6 = 60°. Logo o arco AB mede 60°.\",\n      \"O decágono tem 10 lados: 360 ÷ 10 = 36°. Logo o arco CD mede 36°.\",\n      \"P está dentro da circunferência, onde as cordas AD e BC se cruzam: ângulo excêntrico interno.\",\n      \"O ângulo APB enxerga justamente os arcos AB e CD: APB = (60 + 36) ÷ 2 = 48°.\",\n      \"α = BPD é o suplemento desse, porque os dois formam um ângulo raso ao longo da corda: α = 180 − 48 = 132°.\"\n    ],\n    gabarito: \"α = 132°\"\n  }\n];\n\nclass Component extends DCLogic {\n  state = { passos: {}, feitas: {}, respostas: {}, gabarito: false };\n\n  componentDidMount() {\n    try {\n      const salvo = JSON.parse(window.localStorage.getItem(LISTA) || \"{}\");\n      this.setState({ feitas: salvo.feitas || {}, respostas: salvo.respostas || {} });\n    } catch (e) { /* primeira visita, ou navegador sem armazenamento */ }\n  }\n\n  gravar(feitas, respostas) {\n    try {\n      window.localStorage.setItem(LISTA, JSON.stringify({ feitas, respostas }));\n    } catch (e) { /* segue sem gravar */ }\n  }\n\n  marcar(i) {\n    this.setState((s) => {\n      const feitas = { ...s.feitas, [i]: !s.feitas[i] };\n      this.gravar(feitas, s.respostas);\n      return { feitas };\n    });\n  }\n\n  anotar(i, texto) {\n    this.setState((s) => {\n      const respostas = { ...s.respostas, [i]: texto };\n      this.gravar(s.feitas, respostas);\n      return { respostas };\n    });\n  }\n\n  verPassos(i, quantos) {\n    this.setState((s) => ({ passos: { ...s.passos, [i]: quantos } }));\n  }\n\n  renderVals() {\n    const { passos, feitas, respostas, gabarito } = this.state;\n\n    const questoes = QUESTOES.map((q, i) => {\n      const total = q.passos.length;\n      const semResolucao = total === 0;\n      const abertos = passos[i] || 0;\n      const terminou = !semResolucao && abertos >= total;\n      const feita = !!feitas[i];\n      return {\n        n: q.numero,\n        assunto: q.assunto,\n        origem: q.origem,\n        enunciado: q.enunciado,\n        moldura: {\n          borderTop: feita ? \"2px solid var(--color-accent)\" : \"2px solid var(--color-text)\",\n          paddingTop: \"22px\",\n          background: feita ? \"var(--color-accent-100)\" : \"transparent\",\n          paddingLeft: feita ? \"20px\" : \"0\",\n          paddingRight: feita ? \"20px\" : \"0\",\n          paddingBottom: feita ? \"22px\" : \"0\"\n        },\n        temFigura: !!q.figura,\n        figura: FIGURAS[q.figura] || q.figura || \"\",\n        figuraAlt: q.figuraAlt || \"Figura da questão\",\n        temAlternativas: !!(q.alternativas && q.alternativas.length),\n        alternativas: (q.alternativas || []).map((t) => ({ texto: t })),\n        idCampo: \"resposta-\" + i,\n        resposta: respostas[i] || \"\",\n        anotar: (ev) => this.anotar(i, ev.target.value),\n        marcar: () => this.marcar(i),\n        rotuloFeita: feita ? \"✓ Já fiz\" : \"Marcar como feita\",\n        passosVisiveis: q.passos.slice(0, abertos).map((t, j) => ({\n          n: \"Passo \" + (j + 1),\n          texto: t\n        })),\n        semResolucao,\n        avisoPendente: q.pendente || \"\",\n        nadaAberto: !semResolucao && abertos === 0,\n        temMaisPassos: !semResolucao && !terminou,\n        terminou,\n        mostrarExtras: terminou,\n        rotuloPasso: abertos === 0 ? \"Ver o primeiro passo\" : \"Ver o próximo passo\",\n        umPasso: () => this.verPassos(i, abertos + 1),\n        tudo: () => this.verPassos(i, total),\n        esconder: () => this.verPassos(i, 0),\n        gabarito: q.gabarito,\n        temVideo: !!q.video,\n        video: q.video || \"\",\n        temFoto: !!q.foto,\n        foto: FIGURAS[q.foto] || q.foto || \"\"\n      };\n    });\n\n    const feitasQtd = QUESTOES.filter((_, i) => feitas[i]).length;\n\n    return {\n      questoes,\n      progressoTexto: feitasQtd === 0\n        ? \"Nenhuma questão marcada ainda\"\n        : feitasQtd + \" de \" + QUESTOES.length + \" questões feitas\",\n      barraProgresso: {\n        width: Math.max(2, (feitasQtd / QUESTOES.length) * 100) + \"%\",\n        height: \"16px\",\n        background: \"var(--color-accent)\"\n      },\n      limpar: () => {\n        this.setState({ feitas: {}, respostas: {}, passos: {} });\n        this.gravar({}, {});\n      },\n      gabaritoAberto: gabarito,\n      rotuloGabarito: gabarito ? \"Esconder gabarito\" : \"Mostrar gabarito\",\n      alternarGabarito: () => this.setState((s) => ({ gabarito: !s.gabarito }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
