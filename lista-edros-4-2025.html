  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00)}\n.cap{font-size:10px;color:var(--color-neutral-700);margin-top:4px;line-height:1.4}\n.alts{display:grid;grid-template-columns:repeat(5,max-content);justify-content:space-between;gap:4px 20px;align-items:center;font-size:12.5px;line-height:1.5;margin:0 0 12px}\n.altg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 12px}\n.altg>div{border:1px solid #d7d3d3;padding:6px;background:#fff}\n.altg b{font-family:var(--font-heading);font-size:13px;display:block;margin-bottom:4px}\n.altg svg{display:block;width:100%;height:auto}\n.fig{display:block;max-width:100%;height:auto;margin:0 auto 12px;background:#fff}\ntable.t{border-collapse:collapse;font-size:12px;margin:0 auto 12px;background:#fff}\ntable.t th,table.t td{border:1px solid #201e1d;padding:4px 10px;text-align:center}\ntable.t th{background:#e6f2f2;font-family:var(--font-heading)}\n.math{font-family:\"Times New Roman\",serif;font-style:italic;font-size:15px}\n.cen{text-align:center;margin:0 0 10px}\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:12px;line-height:1.15;margin:0 2px}\n.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}\n.alts>div,.altg>div{cursor:pointer;border:1.5px solid transparent;padding:4px 8px;transition:background .15s,border-color .15s}\n.altg>div{border:1.5px solid #d7d3d3}\n.alts>div:hover,.altg>div:hover{background:#e6f2f2;border-color:#309898}\n.alts>div.ok,.altg>div.ok{background:#e3f4e8;border-color:#1f8a4c}\n.alts>div.no,.altg>div.no{background:#fbe6e2;border-color:#c0392b}\n.alts>div.ok::after,.altg>div.ok::after{content:\" ✓\";color:#1f8a4c;font-weight:700}\n.alts>div.no::after,.altg>div.no::after{content:\" ✗\";color:#c0392b;font-weight:700}\n.fb{font-family:var(--font-heading);font-weight:700;font-size:12.5px;margin:-4px 0 12px;padding:6px 10px;display:none}\n.fb.ok{display:block;background:#e3f4e8;color:#14613a}\n.fb.no{display:block;background:#fbe6e2;color:#8f2a1f}\n<\u002Fstyle>\n<script>\ndocument.addEventListener('click', function(e){\n  var it = e.target.closest('.alts>div, .altg>div'); if(!it) return;\n  var q = it.closest('.q'); var box = it.parentElement;\n  var g = (q.querySelector('.gab span')||{}).textContent||''; var right = (g.match(/([A-E])\\s*$/)||[])[1];\n  var items = [].slice.call(box.children); var idx = items.indexOf(it); var letter = 'ABCDE'[idx];\n  items.forEach(function(x){ x.classList.remove('ok','no'); });\n  var fb = box.nextElementSibling; if(!fb || !fb.classList.contains('fb')){ fb = document.createElement('div'); fb.className='fb'; box.after(fb); }\n  fb.classList.remove('ok','no');\n  if (letter === right){ it.classList.add('ok'); fb.classList.add('ok'); fb.textContent = 'Acertou! A resposta é ' + right.toLowerCase() + ').'; }\n  else { it.classList.add('no'); fb.classList.add('no'); fb.textContent = 'Não é a ' + letter.toLowerCase() + '). Tente de novo ou abra os passos da resolução.'; }\n});\n<\u002Fscript>\n<\u002Fhelmet>\n<div style=\"max-width:880px;margin:0 auto;padding:28px 20px 60px\">\n<a href=\"index.html\" style=\"display:inline-block;font-family:var(--font-heading);font-weight:700;font-size:14px;color:#1f6a6b;margin-bottom:14px\">← Todas as listas<\u002Fa>\n<div style=\"display:flex;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-heading)\">\n<span>4ª Avaliação Edros · 2025 · 1ª série<\u002Fspan><span style=\"color:var(--color-accent-700)\">Solução comentada<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin:14px 0 6px;font-family:var(--font-heading);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent-700)\">Questões 71 a 90<\u002Fdiv>\n<h1 style=\"font-family:var(--font-heading);font-size:30px;font-weight:700;line-height:1.05;margin:0 0 8px\">Matemática e suas Tecnologias<\u002Fh1>\n<p style=\"font-size:12.5px;line-height:1.5;margin:0 0 14px;max-width:62ch\">Estatística, funções exponenciais, progressões, polígonos e transformações geométricas, com a numeração original da prova. Tente resolver antes de abrir os passos.<\u002Fp>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 71<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: A<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Durante a preparação para a feira de Ciências, a professora aplicou um teste sobre sustentabilidade aos seus alunos da 1ª série do Ensino Médio. Após corrigir as provas, ela registrou as notas em uma planilha e construiu a tabela de frequências a seguir.<\u002Fp><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Nota<\u002Fsc-raw-th><sc-raw-th>Número de estudantes<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4,0<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5,5<\u002Fsc-raw-td><sc-raw-td>6<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6,0<\u002Fsc-raw-td><sc-raw-td>9<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7,0<\u002Fsc-raw-td><sc-raw-td>5<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8,0<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9,5<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><p class=\"en\">De acordo com essas informações, a mediana e a moda das notas dessa prova são, respectivamente,<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 6,0 e 6,0.<\u002Fdiv><div><b>b)<\u002Fb> 6,0 e 9,5.<\u002Fdiv><div><b>c)<\u002Fb> 6,4 e 6,0.<\u002Fdiv><div><b>d)<\u002Fb> 6,5 e 9,5.<\u002Fdiv><div><b>e)<\u002Fb> 6,7 e 6,0.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Total de estudantes: 3 + 6 + 9 + 5 + 4 + 3 = <b>30<\u002Fb> (número par).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Com 30 notas em ordem, a mediana é a média da 15ª e da 16ª.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Frequências acumuladas: 4,0 → até a 3ª; 5,5 → até a 9ª; 6,0 → até a <b>18ª<\u002Fb>. A 15ª e a 16ª notas são 6,0 ⇒ mediana = <b>6,0<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Moda é a nota mais frequente: 6,0 (9 estudantes) ⇒ moda = <b>6,0<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Não confunda mediana com a média das notas da tabela, nem com o valor do meio da coluna “Nota”: ela depende das frequências.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 72<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Estudos mostram que, sob condições ideais de cultivo, uma população de <i>Escherichia coli<\u002Fi> duplica a cada 20 minutos, de modo que seu crescimento pode ser descrito pela função exponencial que relaciona o número de bactérias N(t) com o tempo t, em minuto:<\u002Fp><p class=\"cen math\">N(t) = N<sub>0<\u002Fsub> · 2<sup>t/20<\u002Fsup><\u002Fp><p class=\"en\">em que N<sub>0<\u002Fsub> é a quantidade inicial dessas bactérias.<\u002Fp><p style=\"font-size:10px;color:#605d5d;margin:-4px 0 10px;text-align:right\">Growth and maintenance of Escherichia coli laboratory strains. Disponível em: https://pmc.ncbi.nlm.nih.gov. Acesso em: 30 mar. 2025.<\u002Fp><p class=\"en\">Em um protocolo de biotecnologia, inicia-se uma cultura de <i>E. coli<\u002Fi> com 500 unidades. Para que a fase de extração de proteínas seja iniciada, os pesquisadores precisam que a população alcance 16 000 unidades.<\u002Fp><p class=\"en\">Considerando o modelo citado, em quantos minutos a população atingirá a quantidade mínima necessária para iniciar a extração de proteínas?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 32<\u002Fdiv><div><b>b)<\u002Fb> 60<\u002Fdiv><div><b>c)<\u002Fb> 80<\u002Fdiv><div><b>d)<\u002Fb> 100<\u002Fdiv><div><b>e)<\u002Fb> 120<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">N<sub>0<\u002Fsub> = 500 e N(t) = 16 000: 500 · 2<sup>t/20<\u002Fsup> = 16 000.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Divida por 500: 2<sup>t/20<\u002Fsup> = 32 = 2<sup>5<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Bases iguais ⇒ expoentes iguais: t/20 = 5 ⇒ <b>t = 100 min<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Conferência: 100 min = 5 duplicações ⇒ 500 → 1 000 → 2 000 → 4 000 → 8 000 → 16 000. ✓<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">A alternativa a) (32) é o fator de crescimento, não o tempo.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 73<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: C<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Uma dívida de 6 500 reais vinha sendo paga em parcelas mensais de 260 reais, sem juros. Ontem, quando a dívida era de apenas 1 040 reais, a pessoa endividada recebeu um benefício financeiro que lhe permitiu quitá-la, pagando todo o restante da dívida em uma última parcela.<\u002Fp><p class=\"en\">Em quantas parcelas essa dívida foi paga?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 20<\u002Fdiv><div><b>b)<\u002Fb> 21<\u002Fdiv><div><b>c)<\u002Fb> 22<\u002Fdiv><div><b>d)<\u002Fb> 23<\u002Fdiv><div><b>e)<\u002Fb> 25<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Valor já pago em parcelas de 260: 6 500 − 1 040 = 5 460 reais.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Número dessas parcelas: 5 460 ÷ 260 = <b>21<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Somando a última parcela (os 1 040 restantes): 21 + 1 = <b>22 parcelas<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">21 é só o número de parcelas de 260 reais — falta contar a parcela final que quitou a dívida.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 74<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Uma pesquisa realizada entre estudantes do Ensino Médio de uma escola revelou que x pessoas ainda não sabem qual área seguir no Ensino Superior; 2x querem cursar algo na área de Humanidades; 3x desejam cursar algo na área de Exatas; e 4x pretendem seguir na área de Biológicas. Sabe-se também que nenhum estudante respondeu mais de uma vez à pesquisa, nem escolheu mais de uma resposta.<\u002Fp><p class=\"en\">Sabendo que a quantidade total de estudantes entrevistados é dada por x + 2x + 3x + 4x, é correto afirmar que, ao elaborar um gráfico de setores para representar esses dados, o maior setor terá um ângulo central de:<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 36 graus<\u002Fdiv><div><b>b)<\u002Fb> 90 graus<\u002Fdiv><div><b>c)<\u002Fb> 120 graus<\u002Fdiv><div><b>d)<\u002Fb> 144 graus<\u002Fdiv><div><b>e)<\u002Fb> 180 graus<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Total: x + 2x + 3x + 4x = <b>10x<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">O maior grupo é Biológicas: 4x de 10x = 4/10 = 40% do total.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Ângulo central: 0,4 · 360° = <b>144°<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">O x se cancela: não é preciso saber quantos estudantes foram entrevistados.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 75<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Observe o padrão da sequência de figuras a seguir.<\u002Fp><div style=\"display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:0 0 12px;flex-wrap:wrap;font-size:11px\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span>Figura 1<\u002Fspan><svg sc-camel-view-box=\"0 0 38 38\" width=\"38\" style=\"display:block\"><rect x=\"1\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><\u002Fsvg><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span>Figura 2<\u002Fspan><svg sc-camel-view-box=\"0 0 56 56\" width=\"56\" style=\"display:block\"><rect x=\"1\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><\u002Fsvg><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span>Figura 3<\u002Fspan><svg sc-camel-view-box=\"0 0 74 74\" width=\"74\" style=\"display:block\"><rect x=\"1\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"55\" y=\"1\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"55\" y=\"19\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"55\" y=\"37\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"1\" y=\"55\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"19\" y=\"55\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"37\" y=\"55\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><rect x=\"55\" y=\"55\" width=\"18\" height=\"18\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Frect><\u002Fsvg><\u002Fdiv><\u002Fdiv><p class=\"en\">Observando esse padrão e considerando que n representa a n-ésima figura dessa sequência, a fórmula que indica a razão (r<sub>n<\u002Fsub>) entre o número de quadrados cinza e o número total de quadrados da n-ésima figura, nessa ordem, é expressa por:<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> r<sub>n<\u002Fsub> = <span class=\"frac\"><span>2n<\u002Fspan><span>n²<\u002Fspan><\u002Fspan><\u002Fdiv><div><b>b)<\u002Fb> r<sub>n<\u002Fsub> = <span class=\"frac\"><span>n<\u002Fspan><span>n + 1<\u002Fspan><\u002Fspan><\u002Fdiv><div><b>c)<\u002Fb> r<sub>n<\u002Fsub> = <span class=\"frac\"><span>3n<\u002Fspan><span>(n + 1)²<\u002Fspan><\u002Fspan><\u002Fdiv><div><b>d)<\u002Fb> r<sub>n<\u002Fsub> = <span class=\"frac\"><span>(n + 1)² − (n + 1)<\u002Fspan><span>n · 2(n + 1)<\u002Fspan><\u002Fspan><\u002Fdiv><div><b>e)<\u002Fb> r<sub>n<\u002Fsub> = <span class=\"frac\"><span>2n<\u002Fspan><span>(n + 1)²<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">A figura n é um quadrado de lado <b>n + 1<\u002Fb>: 2 × 2, 3 × 3, 4 × 4… ⇒ total = (n + 1)² quadrados.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Só a primeira linha é branca: (n + 1) quadrados brancos.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Cinza = (n + 1)² − (n + 1) = (n + 1)(n + 1 − 1) = <b>n(n + 1)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">r<sub>n<\u002Fsub> = <span class=\"frac\"><span>n(n + 1)<\u002Fspan><span>(n + 1)²<\u002Fspan><\u002Fspan> = <b><span class=\"frac\"><span>n<\u002Fspan><span>n + 1<\u002Fspan><\u002Fspan><\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Conferência: figura 1 → 2/4 = 1/2 ✓; figura 2 → 6/9 = 2/3 ✓; figura 3 → 12/16 = 3/4 ✓.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">A alternativa d) parece certa porque começa com (n + 1)² − (n + 1), mas o denominador está errado: ela vale sempre 1/2.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 76<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em tratamentos médicos, certos medicamentos são eliminados naturalmente pelo organismo ao longo do tempo. Considere que, após a aplicação de uma dose única de um antibiótico de 100 mg, a quantidade da substância presente no corpo do paciente A(t), em miligrama, pode ser expressa por:<\u002Fp><p class=\"cen math\">A(t) = 100 · (0,4)<sup>t/8<\u002Fsup><\u002Fp><p class=\"en\">Sabe-se que, nessa expressão, t indica o tempo, em hora, que o organismo do paciente leva para eliminar a substância naturalmente.<\u002Fp><p class=\"en\">O menor valor inteiro de tempo t, em hora, para que a quantidade do antibiótico no corpo do paciente seja inferior a 16 mg é<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 32.<\u002Fdiv><div><b>b)<\u002Fb> 17.<\u002Fdiv><div><b>c)<\u002Fb> 16.<\u002Fdiv><div><b>d)<\u002Fb> 15.<\u002Fdiv><div><b>e)<\u002Fb> 4.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Condição: 100 · (0,4)<sup>t/8<\u002Fsup> &lt; 16 ⇒ (0,4)<sup>t/8<\u002Fsup> &lt; 0,16.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Escreva 0,16 na mesma base: 0,16 = (0,4)<sup>2<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Base entre 0 e 1 ⇒ a desigualdade <b>inverte<\u002Fb>: t/8 &gt; 2 ⇒ t &gt; 16.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">O menor inteiro maior que 16 é <b>17 h<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Em t = 16 h a quantidade é exatamente 16 mg — não é “inferior a 16”. Por isso 16 não serve.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 77<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: A<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Na disciplina de Cálculo I, em uma universidade, a avaliação é composta de três provas ao longo do semestre. Para ser aprovado, o estudante precisa alcançar uma média ponderada mínima de 6,0. Devido à complexidade dos conteúdos abordados, cada prova tem um peso diferente: a primeira e a segunda têm peso 3, enquanto a terceira, por abranger os conteúdos finais e mais densos, tem peso 4.<\u002Fp><p class=\"en\">Um estudante já realizou as duas primeiras provas e obteve as seguintes notas:<\u002Fp><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Prova<\u002Fsc-raw-th><sc-raw-th>Nota<\u002Fsc-raw-th><sc-raw-th>Peso<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Prova 1<\u002Fsc-raw-td><sc-raw-td>7,0<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Prova 2<\u002Fsc-raw-td><sc-raw-td>5,5<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Prova 3<\u002Fsc-raw-td><sc-raw-td>?<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><p class=\"en\">Com base nesses dados, qual deve ser a nota mínima que o estudante precisa obter na terceira prova para ser aprovado na disciplina?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 5,625<\u002Fdiv><div><b>b)<\u002Fb> 5,500<\u002Fdiv><div><b>c)<\u002Fb> 5,250<\u002Fdiv><div><b>d)<\u002Fb> 5,167<\u002Fdiv><div><b>e)<\u002Fb> 4,125<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Média ponderada: (7,0 · 3 + 5,5 · 3 + x · 4) ÷ (3 + 3 + 4) ≥ 6,0.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Numerador conhecido: 21 + 16,5 = 37,5. Soma dos pesos: 10.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">37,5 + 4x ≥ 60 ⇒ 4x ≥ 22,5 ⇒ <b>x ≥ 5,625<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Dividir por 3 (número de provas) em vez de 10 (soma dos pesos) leva a um valor errado.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 78<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: E<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Estando um capacitor carregado, pode-se montar um circuito para sua descarga. Esse circuito é tal que, ao fecharmos sua chave no instante t = 0, o capacitor inicia esse processo através de um resistor. Nesse instante, a corrente no circuito será máxima e, a partir daí, diminuirá obedecendo a uma função exponencial, até atingir o valor zero – quando o capacitor estiver totalmente descarregado.<\u002Fp><p class=\"en\">A equação da corrente em função do tempo é dada por:<\u002Fp><p class=\"cen math\">i(t) = I<sub>max<\u002Fsub> · e<sup>−t/υ<\u002Fsup><\u002Fp><p style=\"font-size:10px;color:#605d5d;margin:-4px 0 10px;text-align:right\">Disponível em: https://www.udesc.br. Acesso em: 20 jun. 2025.<\u002Fp><p class=\"en\">Sabe-se que na função dada:<\u002Fp><ul style=\"font-size:12.5px;line-height:1.5;margin:0 0 10px;padding-left:20px\"><li>I<sub>max<\u002Fsub> representa a intensidade máxima da corrente;<\u002Fli><li>υ representa um parâmetro positivo que depende do tipo de resistência e do tipo de capacitor;<\u002Fli><li>e representa a constante de Euler, aproximadamente, 2,7;<\u002Fli><li>t representa o tempo, em segundo.<\u002Fli><\u002Ful><p class=\"en\">O gráfico que melhor ilustra o comportamento da corrente elétrica ao longo do tempo, de acordo com essa função, é:<\u002Fp><div class=\"altg\"><div><b>a)<\u002Fb><svg sc-camel-view-box=\"0 0 150 100\"><path d=\"M18 90H142M18 90V8\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M18 4l-3 7h6zM146 90l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><text x=\"23\" y=\"12\" font-size=\"9\" fill=\"#201e1d\">i(t)<\u002Ftext><text x=\"138\" y=\"84\" font-size=\"9\" fill=\"#201e1d\">t<\u002Ftext><path d=\"M18 76 Q80 70 135 14\" stroke=\"#201e1d\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>b)<\u002Fb><svg sc-camel-view-box=\"0 0 150 100\"><path d=\"M18 90H142M18 90V8\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M18 4l-3 7h6zM146 90l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><text x=\"23\" y=\"12\" font-size=\"9\" fill=\"#201e1d\">i(t)<\u002Ftext><text x=\"138\" y=\"84\" font-size=\"9\" fill=\"#201e1d\">t<\u002Ftext><path d=\"M18 22 Q80 30 118 90\" stroke=\"#201e1d\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>c)<\u002Fb><svg sc-camel-view-box=\"0 0 150 100\"><path d=\"M18 90H142M18 90V8\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M18 4l-3 7h6zM146 90l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><text x=\"23\" y=\"12\" font-size=\"9\" fill=\"#201e1d\">i(t)<\u002Ftext><text x=\"138\" y=\"84\" font-size=\"9\" fill=\"#201e1d\">t<\u002Ftext><path d=\"M18 82 L135 16\" stroke=\"#201e1d\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>d)<\u002Fb><svg sc-camel-view-box=\"0 0 150 100\"><path d=\"M18 90H142M18 90V8\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M18 4l-3 7h6zM146 90l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><text x=\"23\" y=\"12\" font-size=\"9\" fill=\"#201e1d\">i(t)<\u002Ftext><text x=\"138\" y=\"84\" font-size=\"9\" fill=\"#201e1d\">t<\u002Ftext><path d=\"M18 20 L120 90\" stroke=\"#201e1d\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>e)<\u002Fb><svg sc-camel-view-box=\"0 0 150 100\"><path d=\"M18 90H142M18 90V8\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M18 4l-3 7h6zM146 90l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><text x=\"23\" y=\"12\" font-size=\"9\" fill=\"#201e1d\">i(t)<\u002Ftext><text x=\"138\" y=\"84\" font-size=\"9\" fill=\"#201e1d\">t<\u002Ftext><path d=\"M20 12 Q32 78 135 88\" stroke=\"#201e1d\" stroke-width=\"1.8\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Em t = 0: i(0) = I<sub>max<\u002Fsub> · e<sup>0<\u002Fsup> = I<sub>max<\u002Fsub> → o gráfico começa no valor máximo, no eixo vertical.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">e<sup>−t/υ<\u002Fsup> = (1/e)<sup>t/υ<\u002Fsup>, com base 1/e entre 0 e 1 ⇒ função exponencial <b>decrescente<\u002Fb>. Descarte a) e c).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Exponencial não é reta: descarte d).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">A exponencial nunca chega a zero, só se aproxima dele cada vez mais devagar (curva que “deita” sobre o eixo t). Em b) a curva cai cada vez mais rápido e corta o eixo — não serve. Resposta: <b>e)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Não confunda “diminui até zero” com cortar o eixo: o gráfico exponencial tem o eixo t como assíntota.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 79<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Ticket médio (TM) é o valor que, em média, cada cliente gasta durante um período específico. Para calculá-lo, os gestores dividem o faturamento total pelo número de transações ou de clientes. O cálculo é dado por:<\u002Fp><p class=\"cen\">TM = <span class=\"frac\"><span>Faturamento total<\u002Fspan><span>Número de vendas<\u002Fspan><\u002Fspan><\u002Fp><p class=\"en\">Essa métrica é fundamental para entender o comportamento de compra e a eficiência das estratégias de vendas. Com o ticket médio, é possível identificar o desempenho de produtos e serviços, além de ajustar táticas comerciais para otimizar os resultados financeiros.<\u002Fp><p style=\"font-size:10px;color:#605d5d;margin:-4px 0 10px;text-align:right\">Disponível em: https://blog.pagseguro.uol.com.br. Acesso em: 6 jun. 2025.<\u002Fp><p class=\"en\">Uma loja on-line de eletrônicos registrou as seguintes vendas em cinco dias consecutivos, conforme indicado a seguir. Nessa tabela, apresenta-se os valores de cada venda em seu respectivo dia, sendo que os traços indicam que não houve venda naquele determinado dia.<\u002Fp><div style=\"overflow-x:auto;display:flex;justify-content:center\"><sc-raw-table class=\"t\" style=\"margin:0 0 12px\"><sc-raw-tr><sc-raw-th>Dia da semana<\u002Fsc-raw-th><sc-raw-th>Venda 1<\u002Fsc-raw-th><sc-raw-th>Venda 2<\u002Fsc-raw-th><sc-raw-th>Venda 3<\u002Fsc-raw-th><sc-raw-th>Venda 4<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Segunda-feira<\u002Fsc-raw-td><sc-raw-td>R$ 125,00<\u002Fsc-raw-td><sc-raw-td>R$ 99,00<\u002Fsc-raw-td><sc-raw-td>R$ 215,00<\u002Fsc-raw-td><sc-raw-td>–<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Terça-feira<\u002Fsc-raw-td><sc-raw-td>R$ 250,00<\u002Fsc-raw-td><sc-raw-td>R$ 113,00<\u002Fsc-raw-td><sc-raw-td>R$ 89,00<\u002Fsc-raw-td><sc-raw-td>R$ 176,00<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Quarta-feira<\u002Fsc-raw-td><sc-raw-td>R$ 96,00<\u002Fsc-raw-td><sc-raw-td>R$ 180,00<\u002Fsc-raw-td><sc-raw-td>R$ 221,00<\u002Fsc-raw-td><sc-raw-td>–<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Quinta-feira<\u002Fsc-raw-td><sc-raw-td>R$ 316,00<\u002Fsc-raw-td><sc-raw-td>R$ 70,00<\u002Fsc-raw-td><sc-raw-td>–<\u002Fsc-raw-td><sc-raw-td>–<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sexta-feira<\u002Fsc-raw-td><sc-raw-td>R$ 190,00<\u002Fsc-raw-td><sc-raw-td>R$ 236,00<\u002Fsc-raw-td><sc-raw-td>R$ 111,00<\u002Fsc-raw-td><sc-raw-td>R$ 165,00<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><\u002Fdiv><p class=\"en\">Considerando que o faturamento total diário é a soma das vendas realizadas no dia, em qual dia da semana a loja registrou o maior ticket médio?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> Segunda-feira<\u002Fdiv><div><b>b)<\u002Fb> Terça-feira<\u002Fdiv><div><b>c)<\u002Fb> Quarta-feira<\u002Fdiv><div><b>d)<\u002Fb> Quinta-feira<\u002Fdiv><div><b>e)<\u002Fb> Sexta-feira<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Segunda: 125 + 99 + 215 = 439 ÷ 3 ≈ R$ 146,33.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Terça: 250 + 113 + 89 + 176 = 628 ÷ 4 = R$ 157,00.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Quarta: 96 + 180 + 221 = 497 ÷ 3 ≈ R$ 165,67.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Quinta: 316 + 70 = 386 ÷ 2 = <b>R$ 193,00<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Sexta: 190 + 236 + 111 + 165 = 702 ÷ 4 = R$ 175,50. Maior ticket médio: <b>quinta-feira<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Sexta tem o maior faturamento (R$ 702), mas também mais vendas. Os traços não contam como venda: divida só pelo número de vendas realizadas.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 80<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Durante a preparação para uma maratona em uma avenida de uma cidade, os organizadores decidiram distribuir barracas com garrafinhas de água ao longo do percurso para ajudar os corredores.<\u002Fp><p class=\"en\">A primeira barraca, que é a mais próxima da linha de largada, será colocada a 1 000 metros dela. As demais serão posicionadas a uma distância constante de 500 metros em relação à anterior, ou seja, a segunda barraca estará a 1 500 metros de distância da largada, a terceira a 2 000 metros de distância da largada, e assim sucessivamente.<\u002Fp><p class=\"en\">Um ponto de assistência médica será instalado na 15ª barraca.<\u002Fp><p class=\"en\">Qual é a distância, em metro, da largada até o ponto de assistência médica?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 7 500<\u002Fdiv><div><b>b)<\u002Fb> 8 000<\u002Fdiv><div><b>c)<\u002Fb> 8 500<\u002Fdiv><div><b>d)<\u002Fb> 9 000<\u002Fdiv><div><b>e)<\u002Fb> 9 500<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">As distâncias formam uma PA: a<sub>1<\u002Fsub> = 1 000 e razão r = 500.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Termo geral: a<sub>n<\u002Fsub> = a<sub>1<\u002Fsub> + (n − 1) · r.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">a<sub>15<\u002Fsub> = 1 000 + 14 · 500 = 1 000 + 7 000 = <b>8 000 m<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Fazer 15 · 500 = 7 500 esquece que a primeira barraca já está a 1 000 m; usar 15 em vez de 14 dá 8 500.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 81<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">O padrão geométrico a seguir é obtido pela repetição de heptágonos regulares congruentes entre si.<\u002Fp><img class=\"fig\" src=\"575a18e3-4627-412a-b790-c16d60426e27\" alt=\"Padrão de heptágonos regulares com os ângulos x e y indicados\" style=\"width:420px\"><p class=\"en\">Sabendo que todo ângulo interno de um heptágono regular mede aproximadamente 128°30’, pode-se estimar que a soma das medidas x e y dos ângulos indicados na figura vale<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 38°30’.<\u002Fdiv><div><b>b)<\u002Fb> 51°30’.<\u002Fdiv><div><b>c)<\u002Fb> 90°00’.<\u002Fdiv><div><b>d)<\u002Fb> 103°00’.<\u002Fdiv><div><b>e)<\u002Fb> 257°00’.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Olhe um ponto onde dois heptágonos vizinhos se encostam: em volta dele há 360°, formados por 2 ângulos internos e 2 “vãos” (um acima e um abaixo do ponto).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Os dois ângulos internos somam 2 · 128°30’ = 257°00’.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Os dois vãos somam 360° − 257°00’ = <b>103°00’<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">A fileira de baixo é o reflexo da de cima: o vão y, abaixo do encontro na fileira de baixo, é igual ao vão acima do encontro na fileira de cima. Então x e y são os dois vãos de um mesmo tipo de encontro ⇒ x + y = <b>103°00’<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">257°00’ é a soma dos dois ângulos internos, não dos vãos.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 82<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: A<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Durante o monitoramento de um paciente com o uso de um monitor cardíaco portátil, foram registrados dez valores de frequência cardíaca, em batimentos por minuto (bpm), durante a realização de diferentes atividades. Os dados coletados foram organizados no quadro a seguir.<\u002Fp><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Atividade<\u002Fsc-raw-th><sc-raw-th>Frequência cardíaca (bpm)<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>74<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>70<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>72<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>70<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>76<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>72<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>75<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>72<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>78<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>76<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><p class=\"en\">Qual é a mediana e a moda, respectivamente, da frequência cardíaca, em bpm, registradas durante o monitoramento?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 73 e 72.<\u002Fdiv><div><b>b)<\u002Fb> 73 e 70.<\u002Fdiv><div><b>c)<\u002Fb> 74 e 78.<\u002Fdiv><div><b>d)<\u002Fb> 75 e 72.<\u002Fdiv><div><b>e)<\u002Fb> 75 e 70.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Coloque em ordem: 70, 70, 72, 72, 72, 74, 75, 76, 76, 78.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">São 10 valores: mediana = média do 5º e do 6º = (72 + 74) ÷ 2 = <b>73<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Moda: 72 aparece 3 vezes (mais que qualquer outro) ⇒ <b>72<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Calcular a mediana com os dados fora de ordem (5º e 6º da tabela: 76 e 72) dá 74 — errado.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 83<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Durante um acampamento ao ar livre, um grupo desenhou no chão uma rosa dos ventos para se orientar, como mostra a figura a seguir. O ponto central indica a posição do acampamento, e os pontos cardeais (norte, sul, leste e oeste) foram marcados corretamente no início.<\u002Fp><div style=\"max-width:220px;margin:0 auto 12px;background:#fff\"><svg sc-camel-view-box=\"-6 -6 132 132\"><path d=\"M0 0V120M0 0H120M10 0V120M0 10H120M20 0V120M0 20H120M30 0V120M0 30H120M40 0V120M0 40H120M50 0V120M0 50H120M60 0V120M0 60H120M70 0V120M0 70H120M80 0V120M0 80H120M90 0V120M0 90H120M100 0V120M0 100H120M110 0V120M0 110H120M120 0V120M0 120H120\" stroke=\"#c9c7c6\" stroke-width=\".6\"><\u002Fpath><path d=\"M60 60L60 10L49 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 10L71 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L71 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L49 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><circle cx=\"60\" cy=\"10\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"110\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"60\" cy=\"110\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"10\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"60\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><text x=\"64\" y=\"8\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Norte<\u002Ftext><text x=\"116\" y=\"54\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Leste<\u002Ftext><text x=\"64\" y=\"118\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Sul<\u002Ftext><text x=\"4\" y=\"54\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Oeste<\u002Ftext><text x=\"64\" y=\"73\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" fill=\"#201e1d\">Centro<\u002Ftext><\u002Fsvg><\u002Fdiv><p class=\"en\">Mais tarde, ao entrarem em uma trilha, o grupo percebeu que a direção do acampamento havia mudado em relação à posição original. Isso aconteceu porque eles estavam se guiando por um ponto de referência natural. Para se reorientar corretamente, eles precisam girar a rosa dos ventos desenhada anteriormente 90° no sentido horário, mantendo o centro fixo.<\u002Fp><p class=\"en\">Como deve ficar o novo desenho da rosa dos ventos para que o grupo consiga se reorientar?<\u002Fp><div class=\"altg\"><div><b>a)<\u002Fb><svg sc-camel-view-box=\"-6 -6 132 132\"><path d=\"M0 0V120M0 0H120M10 0V120M0 10H120M20 0V120M0 20H120M30 0V120M0 30H120M40 0V120M0 40H120M50 0V120M0 50H120M60 0V120M0 60H120M70 0V120M0 70H120M80 0V120M0 80H120M90 0V120M0 90H120M100 0V120M0 100H120M110 0V120M0 110H120M120 0V120M0 120H120\" stroke=\"#c9c7c6\" stroke-width=\".6\"><\u002Fpath><path d=\"M60 60L60 10L49 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 10L71 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L71 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L49 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><circle cx=\"60\" cy=\"10\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"110\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"60\" cy=\"110\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"10\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"60\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><text x=\"64\" y=\"8\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Leste'<\u002Ftext><text x=\"116\" y=\"54\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Sul'<\u002Ftext><text x=\"64\" y=\"118\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Oeste'<\u002Ftext><text x=\"4\" y=\"54\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Norte'<\u002Ftext><text x=\"64\" y=\"73\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" fill=\"#201e1d\">Centro'<\u002Ftext><\u002Fsvg><\u002Fdiv><div><b>b)<\u002Fb><svg sc-camel-view-box=\"-6 -6 132 132\"><path d=\"M0 0V120M0 0H120M10 0V120M0 10H120M20 0V120M0 20H120M30 0V120M0 30H120M40 0V120M0 40H120M50 0V120M0 50H120M60 0V120M0 60H120M70 0V120M0 70H120M80 0V120M0 80H120M90 0V120M0 90H120M100 0V120M0 100H120M110 0V120M0 110H120M120 0V120M0 120H120\" stroke=\"#c9c7c6\" stroke-width=\".6\"><\u002Fpath><path d=\"M60 60L60 10
