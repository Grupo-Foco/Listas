roke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Norte'<\u002Ftext><text x=\"108\" y=\"108\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Leste'<\u002Ftext><text x=\"12\" y=\"108\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Sul'<\u002Ftext><text x=\"64\" y=\"73\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" fill=\"#201e1d\">Centro'<\u002Ftext><\u002Fsvg><\u002Fdiv><div><b>e)<\u002Fb><svg sc-camel-view-box=\"-6 -6 132 132\"><path d=\"M0 0V120M0 0H120M10 0V120M0 10H120M20 0V120M0 20H120M30 0V120M0 30H120M40 0V120M0 40H120M50 0V120M0 50H120M60 0V120M0 60H120M70 0V120M0 70H120M80 0V120M0 80H120M90 0V120M0 90H120M100 0V120M0 100H120M110 0V120M0 110H120M120 0V120M0 120H120\" stroke=\"#c9c7c6\" stroke-width=\".6\"><\u002Fpath><g transform=\"rotate(45 60 60)\"><path d=\"M60 60L60 10L49 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 10L71 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 49Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L110 60L71 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L71 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L60 110L49 71Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 71Z\" fill=\"#b4b2b1\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><path d=\"M60 60L10 60L49 49Z\" fill=\"#e3e1e0\" stroke=\"#201e1d\" stroke-width=\".8\"><\u002Fpath><\u002Fg><circle cx=\"24.6\" cy=\"24.6\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"95.4\" cy=\"24.6\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"95.4\" cy=\"95.4\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"24.6\" cy=\"95.4\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><circle cx=\"60\" cy=\"60\" r=\"2.2\" fill=\"#201e1d\"><\u002Fcircle><text x=\"12\" y=\"18\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Norte'<\u002Ftext><text x=\"108\" y=\"18\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Leste'<\u002Ftext><text x=\"108\" y=\"108\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"end\" fill=\"#201e1d\">Sul'<\u002Ftext><text x=\"12\" y=\"108\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" text-anchor=\"start\" fill=\"#201e1d\">Oeste'<\u002Ftext><text x=\"64\" y=\"73\" font-size=\"8.5\" stroke=\"#fff\" stroke-width=\"2.4\" paint-order=\"stroke\" fill=\"#201e1d\">Centro'<\u002Ftext><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Sentido horário é o sentido dos ponteiros do relógio: cima → direita → baixo → esquerda → cima.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Girando 90°: Norte (em cima) vai para a <b>direita<\u002Fb>; Leste (direita) vai para <b>baixo<\u002Fb>; Sul (embaixo) vai para a <b>esquerda<\u002Fb>; Oeste (esquerda) vai para <b>cima<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Procure: Oeste’ em cima, Norte’ à direita, Leste’ embaixo, Sul’ à esquerda ⇒ alternativa <b>b)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">d) e e) giram só 45° (a rosa fica em “X”) — descarte.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">A alternativa a) é o giro de 90° no sentido anti-horário (Norte vai para a esquerda).<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 84<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: C<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">A média geométrica é muito utilizada, por exemplo, em matemática financeira, para o cálculo de rendimento médio. Se uma aplicação tem rendimento de 10% em um ano e de 15% em outro ano, o rendimento médio será calculado por √(1,10 · 1,15).<\u002Fp><p class=\"en\">Sabendo que o cálculo de média geométrica para n termos é definido por <sup>n<\u002Fsup>√(a<sub>1<\u002Fsub> · a<sub>2<\u002Fsub> · … · a<sub>n<\u002Fsub>), é correto afirmar que o rendimento médio de uma aplicação com rendimento de 10% no 1º ano, 20% no 2º e 30% no 3º será de:<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> ∛1,6.<\u002Fdiv><div><b>b)<\u002Fb> √1,716.<\u002Fdiv><div><b>c)<\u002Fb> ∛1,716.<\u002Fdiv><div><b>d)<\u002Fb> √3,6.<\u002Fdiv><div><b>e)<\u002Fb> ∛3,6.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Cada rendimento vira um fator de multiplicação: 10% → 1,10; 20% → 1,20; 30% → 1,30.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">São 3 anos ⇒ raiz <b>cúbica<\u002Fb> (n = 3). Descarte b) e d).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Produto: 1,10 · 1,20 = 1,32; 1,32 · 1,30 = <b>1,716<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Rendimento médio = <b>∛1,716<\u002Fb> (≈ 1,197, ou seja, cerca de 19,7% ao ano).<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Somar as taxas (0,1 + 0,2 + 0,3 = 0,6, ou 1,1 + 1,2 + 1,3 = 3,6) leva a a) ou e). Na média geométrica os fatores são multiplicados.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 85<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Um biólogo está monitorando o crescimento de uma comunidade de microalgas, que se reproduzem por meio de divisão celular. Ele modelou esse crescimento por meio de uma função exponencial, representada no gráfico a seguir, que relaciona a quantidade, em milhares, de microalgas na comunidade com o número de dias t desde o início do experimento.<\u002Fp><img class=\"fig\" src=\"5227413d-1bdb-4f1a-b9b2-9f1d0371e630\" alt=\"Gráfico da função f(t) passando por (0, 3), (1, 6) e (2, 12)\" style=\"width:340px\"><p class=\"en\">Qual é a lei da função que representa a quantidade, em milhar, de microalgas em função do tempo, em dia?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> f(t) = 6<sup>t<\u002Fsup><\u002Fdiv><div><b>b)<\u002Fb> f(t) = 3<sup>t<\u002Fsup><\u002Fdiv><div><b>c)<\u002Fb> f(t) = 3 · t<sup>2<\u002Fsup><\u002Fdiv><div><b>d)<\u002Fb> f(t) = 3 · 2<sup>t<\u002Fsup><\u002Fdiv><div><b>e)<\u002Fb> f(t) = 2 · 3<sup>t<\u002Fsup><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Leia os pontos marcados: (0, 3), (1, 6) e (2, 12).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">f(0) = 3 ⇒ valor inicial a = 3 em f(t) = a · b<sup>t<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">De um dia para o outro o valor dobra (3 → 6 → 12) ⇒ base b = 2.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">f(t) = <b>3 · 2<sup>t<\u002Fsup><\u002Fb>. Conferência: f(2) = 3 · 4 = 12 ✓.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">6<sup>t<\u002Fsup> e 3<sup>t<\u002Fsup> valem 1 em t = 0, mas o gráfico corta o eixo em 3. E 3 · t² não é exponencial (daria f(0) = 0).<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 86<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: E<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em um laboratório de Física, estudantes do 1º ano de Engenharia realizaram um experimento em que uma seta de madeira foi colocada diante de um sistema de espelhos planos posicionados perpendicularmente entre si. A imagem a seguir mostra a vista superior desse sistema, sendo que os segmentos perpendiculares representam os espelhos.<\u002Fp><div style=\"max-width:170px;margin:0 auto 12px;background:#fff\"><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><p class=\"en\">De acordo com a imagem apresentada e considerando a vista superior da situação, qual é a posição das outras setas, resultantes das reflexões causadas pelos espelhos?<\u002Fp><div class=\"altg\"><div><b>a)<\u002Fb><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M30 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M30 76l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 76l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>b)<\u002Fb><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M30 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M30 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 76l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>c)<\u002Fb><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M30 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M30 76l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>d)<\u002Fb><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M30 44l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M30 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><b>e)<\u002Fb><svg sc-camel-view-box=\"0 0 120 120\"><path d=\"M0 60H120M60 0V120\" stroke=\"#201e1d\" stroke-width=\"1.2\"><\u002Fpath><path d=\"M30 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 16l11 12h-6v16h-10v-16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M30 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><path d=\"M90 104l11 -12h-6v-16h-10v16h-6z\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">A seta original está no quadrante de cima, à direita, apontando para cima.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Espelho vertical: reflete esquerda ↔ direita. A seta “para cima” continua para cima ⇒ em cima, à esquerda: <b>para cima<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Espelho horizontal: reflete cima ↔ baixo, então a seta inverte ⇒ embaixo, à direita: <b>para baixo<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">A imagem no quadrante oposto (embaixo, à esquerda) é refletida pelos dois espelhos: também <b>para baixo<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Cima: ↑ ↑; baixo: ↓ ↓ ⇒ alternativa <b>e)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Uma reflexão inverte só a direção perpendicular ao espelho. Seta paralela ao espelho não muda de sentido.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 87<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: C<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Uma indústria utiliza um grande volume de água para resfriar maquinários e, após o uso, devolve-a ao rio com uma temperatura elevada. Ambientalistas estão monitorando a temperatura da água do rio por meio de medições diárias, durante uma semana, para garantir a saúde dos seres vivos que habitam esse ambiente. Os resultados obtidos foram os seguintes:<\u002Fp><ul style=\"font-size:12.5px;line-height:1.5;margin:0 0 10px;padding-left:20px;columns:2\"><li>Dia 1: 22,4 °C;<\u002Fli><li>Dia 2: 22,1 °C;<\u002Fli><li>Dia 3: 22,3 °C;<\u002Fli><li>Dia 4: 22,6 °C;<\u002Fli><li>Dia 5: 23,9 °C;<\u002Fli><li>Dia 6: 22,8 °C;<\u002Fli><li>Dia 7: 24,0 °C;<\u002Fli><\u002Ful><p class=\"en\">Qual foi, aproximadamente, a temperatura média, em grau Celsius, da água do rio durante essa semana?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 22,1<\u002Fdiv><div><b>b)<\u002Fb> 22,6<\u002Fdiv><div><b>c)<\u002Fb> 22,9<\u002Fdiv><div><b>d)<\u002Fb> 24,0<\u002Fdiv><div><b>e)<\u002Fb> 26,8<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Some: 22,4 + 22,1 + 22,3 + 22,6 + 23,9 + 22,8 + 24,0 = <b>160,1<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Divida por 7 dias: 160,1 ÷ 7 ≈ <b>22,87<\u002Fb> ≈ 22,9 °C.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Atalho: use 22 como base. Excessos: 0,4 + 0,1 + 0,3 + 0,6 + 1,9 + 0,8 + 2,0 = 6,1; 6,1 ÷ 7 ≈ 0,87 ⇒ 22 + 0,87 ≈ 22,9.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">22,6 é a mediana (valor do meio em ordem), não a média.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 88<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Após meses de pesquisa, uma equipe de biólogos concluiu que um novo tipo de bactéria tem sua população dobrada a cada hora. No organismo humano, essa bactéria começa a causar algum tipo de dano a partir do momento em que sua população atinge 32 768 unidades.<\u002Fp><p class=\"en\">Considerando que, em laboratório, essa equipe conseguiu isolar duas unidades dessa bactéria, que se reproduziam no ritmo mencionado anteriormente, é correto afirmar que essa população atinge a quantidade capaz de causar males ao organismo humano a partir de<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 11 horas.<\u002Fdiv><div><b>b)<\u002Fb> 12 horas.<\u002Fdiv><div><b>c)<\u002Fb> 13 horas.<\u002Fdiv><div><b>d)<\u002Fb> 14 horas.<\u002Fdiv><div><b>e)<\u002Fb> 15 horas.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Modelo: P(t) = 2 · 2<sup>t<\u002Fsup>, com t em hora.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">2 · 2<sup>t<\u002Fsup> = 32 768 ⇒ 2<sup>t<\u002Fsup> = 16 384.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">16 384 = 2<sup>14<\u002Fsup> (2<sup>10<\u002Fsup> = 1 024; 1 024 · 16 = 16 384) ⇒ <b>t = 14 h<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">32 768 = 2<sup>15<\u002Fsup>, mas a população já começa com 2 = 2¹ unidades: o expoente total é 1 + t = 15 ⇒ t = 14, não 15.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 89<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: E<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Um certo banco digital disponibilizou a seus clientes alguns gráficos para facilitar a visualização dos possíveis rendimentos em diferentes aplicações financeiras. Em uma dessas aplicações, o gráfico apresentava o seguinte desempenho:<\u002Fp><div style=\"margin:0 0 12px;display:flex;justify-content:center\"><svg class=\"g\" sc-camel-view-box=\"0 0 260 150\" style=\"width:300px\"><path d=\"M60 128H250M60 128V12\" stroke=\"#201e1d\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M60 8l-3 7h6zM254 128l-7-3v6z\" fill=\"#201e1d\"><\u002Fpath><path d=\"M60 88 C120 88 170 82 200 40\" stroke=\"#201e1d\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><text x=\"56\" y=\"92\" font-size=\"10\" text-anchor=\"end\" fill=\"#201e1d\">10 000<\u002Ftext><text x=\"66\" y=\"14\" font-size=\"10\" fill=\"#201e1d\">M<\u002Ftext><text x=\"250\" y=\"122\" font-size=\"10\" text-anchor=\"end\" fill=\"#201e1d\">t<\u002Ftext><text x=\"250\" y=\"144\" font-size=\"10\" text-anchor=\"end\" fill=\"#201e1d\">Tempo (ano)<\u002Ftext><text x=\"8\" y=\"24\" font-size=\"10\" fill=\"#201e1d\">Montante<\u002Ftext><text x=\"8\" y=\"36\" font-size=\"10\" fill=\"#201e1d\">(em real)<\u002Ftext><\u002Fsvg><\u002Fdiv><p class=\"en\">Além do gráfico, após o cliente inserir o valor inicial a ser aplicado, havia a indicação de como calcular o montante M, em real, pela equação exponencial, com t, em ano, definida por M = C · (1,1)<sup>t<\u002Fsup>.<\u002Fp><p class=\"en\">Dessa maneira, é correto afirmar que essa aplicação acumulará, após três anos, um montante de<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> R$ 3 000,00.<\u002Fdiv><div><b>b)<\u002Fb> R$ 3 310,00.<\u002Fdiv><div><b>c)<\u002Fb> R$ 12 100,00.<\u002Fdiv><div><b>d)<\u002Fb> R$ 13 000,00.<\u002Fdiv><div><b>e)<\u002Fb> R$ 13 310,00.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">No gráfico, em t = 0 o montante é 10 000: M(0) = C · 1,1<sup>0<\u002Fsup> = C ⇒ <b>C = 10 000<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">1,1<sup>3<\u002Fsup> = 1,1 · 1,1 · 1,1 = 1,21 · 1,1 = 1,331.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">M(3) = 10 000 · 1,331 = <b>R$ 13 310,00<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">R$ 13 000,00 seria juros simples (10% de 10 000 por ano); R$ 3 310,00 é só o rendimento, sem o capital.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 90<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">No esquema a seguir, as figuras de 1 a 5 mostram os <i>pixels<\u002Fi> que dão forma à personagem de um jogo eletrônico surgindo na tela de um computador.<\u002Fp><img class=\"fig\" src=\"3c913d56-4fc9-4942-abab-469a5694bad1\" alt=\"Figuras 1 a 5 com os pixels da personagem\" style=\"width:440px\"><p class=\"en\">Sabendo que, até a personagem aparecer completamente, são exibidas 20 figuras, e que a quantidade y de pixels exibidos pela figura x obedece à relação algébrica 1 + y = 3<sup>x<\u002Fsup>, determine o número da figura que exibe a personagem utilizando exatamente 6 560 pixels.<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 7<\u002Fdiv><div><b>b)<\u002Fb> 8<\u002Fdiv><div><b>c)<\u002Fb> 9<\u002Fdiv><div><b>d)<\u002Fb> 10<\u002Fdiv><div><b>e)<\u002Fb> 11<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">y = 6 560 ⇒ 1 + 6 560 = 3<sup>x<\u002Fsup> ⇒ 3<sup>x<\u002Fsup> = 6 561.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Potências de 3: 3, 9, 27, 81, 243, 729, 2 187, <b>6 561<\u002Fb> ⇒ 6 561 = 3<sup>8<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">x = <b>8<\u002Fb>: é a figura 8.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Conferência com a figura: figura 1 → 3 − 1 = 2 pixels; figura 2 → 9 − 1 = 8 pixels ✓.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">Não esqueça de somar 1 antes: 6 560 não é potência de 3, mas 6 561 é.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div style=\"border-top:2px solid var(--color-divider);margin-top:26px;padding-top:12px;break-inside:avoid\">\n<details class=\"fg\"><summary>Mostrar gabarito completo<\u002Fsummary>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));border:2px solid var(--color-divider);font-family:var(--font-heading);text-align:left\">\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">71<\u002Fdiv><b>A<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">72<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">73<\u002Fdiv><b>C<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">74<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">75<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">76<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">77<\u002Fdiv><b>A<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">78<\u002Fdiv><b>E<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">79<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">80<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">81<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">82<\u002Fdiv><b>A<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">83<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">84<\u002Fdiv><b>C<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">85<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">86<\u002Fdiv><b>E<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">87<\u002Fdiv><b>C<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">88<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">89<\u002Fdiv><b>E<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">90<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
