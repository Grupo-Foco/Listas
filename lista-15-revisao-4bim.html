  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

a0+t*j/20; da+='L'+X(ra*Math.cos(aa)).toFixed(1)+' '+Y(ra*Math.sin(aa)).toFixed(1)}\n    g.querySelector('#rot6-arc').setAttribute('d', th>0?da:'');\n    var an=g.querySelector('#rot6-ang'); an.textContent=Math.round(th)+'\\u00b0';\n    var am=a0+t/2; an.setAttribute('x',X(1.6*Math.cos(am))-8); an.setAttribute('y',Y(1.6*Math.sin(am))+4);\n    var o=document.getElementById('rot6-out');\n    if(o) o.innerHTML = th>=90 ? '<b style=\"color:#a3200b\">A\\u2019(\\u22121, 1) \\u00b7 B\\u2019(\\u22121, 4) \\u00b7 C\\u2019(\\u22123, 4)<\u002Fb><br>Cada ponto (x, y) foi para (\\u2212y, x) \\u21d2 alternativa b)'\n      : Q.map(function(q,k){return N[k]+(th>0?'\\u2019':'')+'('+f(q[0])+', '+f(q[1])+')'}).join(' \\u00b7 ');\n  }\n  function btn(){var b=document.getElementById('rot6-play'); if(b) b.textContent = run?'\\u275a\\u275a Pausar':(th>=90?'\\u25b6 Ver de novo':(th>0?'\\u25b6 Continuar':'\\u25b6 Iniciar'))}\n  function tick(ts){ if(!run) return; var dt=ts-last; last=ts; th=Math.min(90, th+90*dt/DUR); draw(); if(th>=90){run=false; btn(); return} requestAnimationFrame(tick) }\n  document.addEventListener('click',function(e){\n    if(e.target.closest('#rot6-play')){ if(run){run=false} else { if(th>=90) th=0; run=true; last=performance.now(); requestAnimationFrame(tick) } btn(); }\n    else if(e.target.closest('#rot6-reset')){ run=false; th=0; draw(); btn(); }\n  });\n})();\n(function(){\n  var p=0, run=false, last=0, DUR=1900;\n  var MSG=['A bandeira original est\\u00e1 no quadrante superior direito.',\n   '<b style=\"color:#a3200b\">Imagem 1 \\u2014 espelho vertical:<\u002Fb> a bandeira vira para a esquerda e continua em p\\u00e9.',\n   '<b style=\"color:#a3200b\">Imagem 2 \\u2014 espelho horizontal:<\u002Fb> a bandeira fica de cabe\\u00e7a para baixo e continua apontando para a direita.',\n   '<b style=\"color:#a3200b\">Imagem 3 \\u2014 imagem da imagem 1:<\u002Fb> aponta para a esquerda e fica de cabe\\u00e7a para baixo (= giro de 180\\u00b0 da original) \\u21d2 alternativa a).'];\n  function ease(x){x=Math.max(0,Math.min(1,x)); return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}\n  function set(id,sx,sy,op){var g=document.getElementById(id); if(!g)return; g.setAttribute('transform','translate(150 150) scale('+sx.toFixed(3)+' '+sy.toFixed(3)+')'); g.setAttribute('opacity',op)}\n  function draw(){\n    set('ref5-i1', 1-2*ease(p), 1, p>0?1:0);\n    set('ref5-i2', 1, 1-2*ease(p-1), p>1?1:0);\n    set('ref5-i3', -1, 1-2*ease(p-2), p>2?1:0);\n    ['ref5-t1','ref5-t2','ref5-t3'].forEach(function(id,k){var t=document.getElementById(id); if(t) t.setAttribute('opacity', p>=k+1?1:0)});\n    var o=document.getElementById('ref5-out'); if(o) o.innerHTML=MSG[p>2?3:(p>1?2:(p>0?1:0))];\n  }\n  function btn(){var b=document.getElementById('ref5-play'); if(b) b.textContent = run?'\\u275a\\u275a Pausar':(p>=3?'\\u25b6 Ver de novo':(p>0?'\\u25b6 Continuar':'\\u25b6 Iniciar'))}\n  function tick(ts){ if(!run) return; var dt=ts-last; last=ts; p=Math.min(3,p+dt/DUR); draw(); if(p>=3){run=false;btn();return} requestAnimationFrame(tick) }\n  document.addEventListener('click',function(e){\n    if(e.target.closest('#ref5-play')){ if(run){run=false} else { if(p>=3) p=0; run=true; last=performance.now(); requestAnimationFrame(tick) } btn(); }\n    else if(e.target.closest('#ref5-reset')){ run=false; p=0; draw(); btn(); }\n  });\n})();\n\ndocument.addEventListener('click', function(e){\n  var it = e.target.closest('.alts>div, .altg>div'); if(!it) return;\n  var q = it.closest('.q'); var box = it.parentElement;\n  var g = (q.querySelector('.gab span')||{}).textContent||''; var right = (g.match(/([A-E])\\s*$/)||[])[1];\n  var items = [].slice.call(box.children); var idx = items.indexOf(it); var letter = 'ABCDE'[idx];\n  items.forEach(function(x){ x.classList.remove('ok','no'); });\n  var fb = box.nextElementSibling; if(!fb || !fb.classList.contains('fb')){ fb = document.createElement('div'); fb.className='fb'; box.after(fb); }\n  fb.classList.remove('ok','no');\n  if (letter === right){ it.classList.add('ok'); fb.classList.add('ok'); fb.textContent = 'Acertou! A resposta é ' + right.toLowerCase() + ').'; }\n  else { it.classList.add('no'); fb.classList.add('no'); fb.textContent = 'Não é a ' + letter.toLowerCase() + '). Tente de novo ou abra os passos da resolução.'; }\n});\n<\u002Fscript>\n<\u002Fhelmet>\n<div style=\"max-width:880px;margin:0 auto;padding:28px 20px 60px\">\n<a href=\"index.html\" style=\"display:inline-block;font-family:var(--font-heading);font-weight:700;font-size:14px;color:#1f6a6b;margin-bottom:14px\">← Todas as listas<\u002Fa>\n<div style=\"display:flex;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-heading)\">\n<span>Lista 15 · 4º bimestre · 1ª série<\u002Fspan><span style=\"color:var(--color-accent-700)\">Solução comentada<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin:14px 0 6px;font-family:var(--font-heading);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent-700)\">Revisão pré-Edros · 8 questões<\u002Fdiv>\n<h1 style=\"font-family:var(--font-heading);font-size:30px;font-weight:700;line-height:1.05;margin:0 0 8px\">Revisão de Matemática<\u002Fh1>\n<p style=\"font-size:12.5px;line-height:1.5;margin:0 0 14px;max-width:62ch\">Função exponencial, P.A., equação modular, transformações geométricas e estatística. Clique numa alternativa para conferir e abra os passos da resolução.<\u002Fp>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 01<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: C<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em um laboratório de microbiologia, a quantidade N de fungos de uma colônia, t horas após o início da observação, é dada pela função<\u002Fp><p class=\"cen math\">N(t) = 200 · 3<sup>t/4<\u002Fsup><\u002Fp><p class=\"en\">A colônia deve ser transferida para um recipiente maior quando atingir 16 200 fungos.<\u002Fp><p class=\"en\">Quantas horas após o início da observação essa transferência deverá ser feita?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 8<\u002Fdiv><div><b>b)<\u002Fb> 12<\u002Fdiv><div><b>c)<\u002Fb> 16<\u002Fdiv><div><b>d)<\u002Fb> 24<\u002Fdiv><div><b>e)<\u002Fb> 81<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Queremos o instante t em que N(t) = 16 200: 200 · 3<sup>t/4<\u002Fsup> = 16 200.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Divida por 200: 3<sup>t/4<\u002Fsup> = 16 200 ÷ 200 = 81.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Escreva 81 como potência de base 3: 81 = 3<sup>4<\u002Fsup> ⇒ 3<sup>t/4<\u002Fsup> = 3<sup>4<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Bases iguais ⇒ expoentes iguais: t/4 = 4 ⇒ <b>t = 16 horas<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">81 (alternativa e) é o resultado da divisão, não o tempo; 12 corresponderia a 3<sup>3<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 02<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Um laboratório acompanha a massa m, em grama, de uma amostra de material radioativo ao longo do tempo t, em ano. Essa massa decresce de forma exponencial, segundo uma lei do tipo m(t) = m<sub>0<\u002Fsub> · b<sup>t<\u002Fsup>, como mostra o gráfico.<\u002Fp><img class=\"fig\" src=\"6507bb6d-64c7-4728-a9de-0960ce48bd95\" alt=\"Gráfico de m(t) passando por (0, 64), (1, 32) e (2, 16)\" style=\"width:420px\"><p class=\"en\">De acordo com o gráfico, a massa dessa amostra será igual a 2 gramas após quantos anos?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 4<\u002Fdiv><div><b>b)<\u002Fb> 5<\u002Fdiv><div><b>c)<\u002Fb> 6<\u002Fdiv><div><b>d)<\u002Fb> 16<\u002Fdiv><div><b>e)<\u002Fb> 32<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Lendo o gráfico: m(0) = 64 ⇒ m<sub>0<\u002Fsub> = 64.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">De t = 0 para t = 1 a massa passa de 64 para 32: cai pela metade a cada ano ⇒ b = 32/64 = 1/2. (Confere: m(2) = 16.)<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Lei: m(t) = 64 · (1/2)<sup>t<\u002Fsup>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">m(t) = 2: (1/2)<sup>t<\u002Fsup> = 2/64 = 1/32 = (1/2)<sup>5<\u002Fsup> ⇒ <b>t = 5 anos<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Verificação pela sequência: 64 → 32 → 16 → 8 → 4 → 2 (5 intervalos de 1 ano).<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">6 aparece para quem conta os termos da sequência (são 6 valores, mas 5 intervalos); 32 é a razão 64/2.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 03<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em um teatro, a primeira fileira tem 18 poltronas e cada fileira seguinte tem 3 poltronas a mais que a anterior, ou seja, a segunda fileira tem 21 poltronas, a terceira tem 24, e assim sucessivamente.<\u002Fp><p class=\"en\">A administração do teatro reservará, para uma escola, a fileira que tem exatamente 63 poltronas.<\u002Fp><p class=\"en\">Qual é a fileira reservada?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 13ª<\u002Fdiv><div><b>b)<\u002Fb> 14ª<\u002Fdiv><div><b>c)<\u002Fb> 15ª<\u002Fdiv><div><b>d)<\u002Fb> 16ª<\u002Fdiv><div><b>e)<\u002Fb> 21ª<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">As quantidades formam uma P.A. com a<sub>1<\u002Fsub> = 18 e razão r = 3.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Termo geral: a<sub>n<\u002Fsub> = a<sub>1<\u002Fsub> + (n − 1) · r.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">63 = 18 + (n − 1) · 3 ⇒ 45 = (n − 1) · 3 ⇒ n − 1 = 15.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">n = 16 ⇒ a fileira reservada é a <b>16ª<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">15 (alternativa c) surge ao esquecer o “−1” do termo geral; 21 vem de 63 ÷ 3, ignorando o primeiro termo.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 04<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: E<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Para preservar a eficácia de certas vacinas, a temperatura T, em grau Celsius, da câmara de refrigeração deve permanecer entre um valor mínimo e um valor máximo. Esses dois valores extremos são as soluções da equação modular<\u002Fp><p class=\"cen math\">|2T − 10| = 6<\u002Fp><p class=\"en\">As temperaturas mínima e máxima permitidas nessa câmara são, respectivamente,<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> −2 °C e 8 °C.<\u002Fdiv><div><b>b)<\u002Fb> −8 °C e 2 °C.<\u002Fdiv><div><b>c)<\u002Fb> 4 °C e 6 °C.<\u002Fdiv><div><b>d)<\u002Fb> 2 °C e 16 °C.<\u002Fdiv><div><b>e)<\u002Fb> 2 °C e 8 °C.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Pela definição de módulo: |x| = 6 ⟺ x = 6 ou x = −6.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">2T − 10 = 6 ⇒ 2T = 16 ⇒ T = 8.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">2T − 10 = −6 ⇒ 2T = 4 ⇒ T = 2.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Mínima e máxima: <b>2 °C e 8 °C<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Interpretação: |2T − 10| = 6 equivale a |T − 5| = 3, ou seja, as temperaturas a 3 °C de distância de 5 °C.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">16 (alternativa d) aparece ao não dividir 2T = 16 por 2; −2 (alternativa a) vem de erro de sinal ao isolar T.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 05<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: A<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em uma aula sobre simetria, uma pequena bandeira de madeira foi colocada diante de dois espelhos planos posicionados perpendicularmente entre si. A imagem mostra a vista superior desse sistema, em que os segmentos perpendiculares representam os espelhos.<\u002Fp><img class=\"fig\" src=\"16cad023-7cad-4433-ad20-e4e730f9e811\" alt=\"Bandeira no quadrante superior direito, diante de dois espelhos perpendiculares\" style=\"width:200px\"><p class=\"en\">Considerando a vista superior da situação, qual alternativa representa corretamente a posição das três imagens da bandeira formadas pelos espelhos?<\u002Fp><div class=\"altg\"><div><b>a)<\u002Fb><img src=\"8d06586e-05bb-41ff-8bec-372aec2806d2\" alt=\"Alternativa a\" style=\"display:block;width:100%;height:auto\"><\u002Fdiv><div><b>b)<\u002Fb><img src=\"1f043892-310c-4706-bd1f-ff1b559efc94\" alt=\"Alternativa b\" style=\"display:block;width:100%;height:auto\"><\u002Fdiv><div><b>c)<\u002Fb><img src=\"d70963bd-cc2b-46da-b946-08b4bdd968b9\" alt=\"Alternativa c\" style=\"display:block;width:100%;height:auto\"><\u002Fdiv><div><b>d)<\u002Fb><img src=\"847fab20-0b27-4a69-8ad8-cc2478b017cc\" alt=\"Alternativa d\" style=\"display:block;width:100%;height:auto\"><\u002Fdiv><div><b>e)<\u002Fb><img src=\"b8d7b620-f1fc-44ac-8c6f-68e55c412a86\" alt=\"Alternativa e\" style=\"display:block;width:100%;height:auto\"><\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Com dois espelhos perpendiculares formam-se <b>três imagens<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Espelho vertical (quadrante superior esquerdo): reflexão em reta vertical — a bandeira inverte a orientação horizontal e passa a apontar para a <b>esquerda<\u002Fb>, continuando “em pé”.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Espelho horizontal (quadrante inferior direito): reflexão em reta horizontal — a bandeira fica <b>de cabeça para baixo<\u002Fb>, ainda apontando para a direita.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">Quadrante oposto (inferior esquerdo): imagem da imagem. Duas reflexões em retas perpendiculares equivalem a uma <b>rotação de 180°<\u002Fb> — a bandeira aponta para a esquerda e fica de cabeça para baixo.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Só a alternativa <b>a)<\u002Fb> mostra as três imagens assim.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"st\" id=\"anim5\" style=\"margin-top:10px\"><summary>Resolução por animação<\u002Fsummary><div class=\"stb\">\n<p style=\"margin:0 0 10px\">Veja cada imagem “virar” sobre o espelho que a forma. Quem fica paralelo ao espelho não muda; quem é perpendicular a ele se inverte.<\u002Fp>\n<svg id=\"ref5\" sc-camel-view-box=\"0 0 300 300\" style=\"display:block;width:100%;max-width:380px;margin:0 auto;background:#fff;border:2px solid var(--color-divider)\">\n<path d=\"M10 150H290M150 10V290\" stroke=\"#201e1d\" stroke-width=\"4\"><\u002Fpath>\n<text x=\"144\" y=\"288\" font-size=\"10\" fill=\"#605d5d\" transform=\"rotate(-90 144 288)\">espelho vertical<\u002Ftext>\n<text x=\"286\" y=\"166\" font-size=\"10\" fill=\"#605d5d\" text-anchor=\"end\">espelho horizontal<\u002Ftext>\n<g id=\"ref5-i3\" transform=\"translate(150 150)\" opacity=\"0\"><rect x=\"28\" y=\"-112\" width=\"9\" height=\"92\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\"><\u002Frect><path d=\"M37 -110L88 -94L37 -78Z\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fg>\n<g id=\"ref5-i2\" transform=\"translate(150 150)\" opacity=\"0\"><rect x=\"28\" y=\"-112\" width=\"9\" height=\"92\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\"><\u002Frect><path d=\"M37 -110L88 -94L37 -78Z\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fg>\n<g id=\"ref5-i1\" transform=\"translate(150 150)\" opacity=\"0\"><rect x=\"28\" y=\"-112\" width=\"9\" height=\"92\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\"><\u002Frect><path d=\"M37 -110L88 -94L37 -78Z\" fill=\"#f6c2b8\" stroke=\"#a3200b\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fg>\n<g id=\"ref5-o\" transform=\"translate(150 150)\"><rect x=\"28\" y=\"-112\" width=\"9\" height=\"92\" fill=\"#9a9897\" stroke=\"#201e1d\" stroke-width=\"2\"><\u002Frect><path d=\"M37 -110L88 -94L37 -78Z\" fill=\"#9a9897\" stroke=\"#201e1d\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fg>\n<text id=\"ref5-t1\" x=\"76\" y=\"140\" font-size=\"11\" font-weight=\"700\" fill=\"#a3200b\" text-anchor=\"middle\" opacity=\"0\">imagem 1<\u002Ftext>\n<text id=\"ref5-t2\" x=\"224\" y=\"290\" font-size=\"11\" font-weight=\"700\" fill=\"#a3200b\" text-anchor=\"middle\" opacity=\"0\">imagem 2<\u002Ftext>\n<text id=\"ref5-t3\" x=\"76\" y=\"290\" font-size=\"11\" font-weight=\"700\" fill=\"#a3200b\" text-anchor=\"middle\" opacity=\"0\">imagem 3<\u002Ftext>\n<text x=\"224\" y=\"26\" font-size=\"11\" font-weight=\"700\" fill=\"#201e1d\" text-anchor=\"middle\">original<\u002Ftext>\n<\u002Fsvg>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 8px\">\n<button type=\"button\" id=\"ref5-play\" style=\"min-height:44px;padding:0 20px;border:0;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;cursor:pointer;text-align:left\">▶ Iniciar<\u002Fbutton>\n<button type=\"button\" id=\"ref5-reset\" style=\"min-height:44px;padding:0 20px;border:2px solid var(--color-text);background:transparent;color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:14px;cursor:pointer;text-align:left\">↺ Reiniciar<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"ref5-out\" style=\"font-family:var(--font-heading);font-size:13px;text-align:center;line-height:1.6;min-height:42px\">A bandeira original está no quadrante superior direito.<\u002Fdiv>\n<\u002Fdiv><\u002Fdetails>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">b mostra apenas translações; c traz a imagem oposta transladada (sem a rotação de 180°); d troca as reflexões dos dois espelhos; e repete no quadrante oposto só a reflexão vertical.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 06<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: B<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Um programa de criação de mosaicos e ladrilhamentos permite girar as peças em torno de um ponto. Uma peça triangular ABC foi posicionada no plano cartesiano, como mostra a figura.<\u002Fp><img class=\"fig\" src=\"3fd64e39-3d8f-4332-aa0a-15abe1b89a8c\" alt=\"Triângulo ABC com A(1, 1), B(4, 1) e C(4, 3) no plano cartesiano\" style=\"width:340px\"><p class=\"en\">Em seguida, a peça foi girada 90° no sentido anti-horário em torno da origem O, gerando o triângulo A’B’C’.<\u002Fp><p class=\"en\">Após essa rotação, as coordenadas dos vértices A’, B’ e C’ são, respectivamente,<\u002Fp><div class=\"alts\" id=\"q6alts\" style=\"display:grid;grid-template-columns:1fr;justify-content:start\"><div><b>a)<\u002Fb> A’(1, −1), B’(1, −4) e C’(3, −4).<\u002Fdiv><div><b>b)<\u002Fb> A’(−1, 1), B’(−1, 4) e C’(−3, 4).<\u002Fdiv><div><b>c)<\u002Fb> A’(−1, 1), B’(−4, 1) e C’(−4, 3).<\u002Fdiv><div><b>d)<\u002Fb> A’(−1, −1), B’(−4, −1) e C’(−4, −3).<\u002Fdiv><div><b>e)<\u002Fb> A’(1, 1), B’(1, 4) e C’(3, 4).<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Lendo a figura: A(1, 1), B(4, 1) e C(4, 3).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Rotação de 90° anti-horária em torno da origem: (x, y) → <b>(−y, x)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\"><div style=\"overflow-x:auto\"><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Vértice<\u002Fsc-raw-th><sc-raw-th>(x, y)<\u002Fsc-raw-th><sc-raw-th>(−y, x)<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A<\u002Fsc-raw-td><sc-raw-td>(1, 1)<\u002Fsc-raw-td><sc-raw-td>A’(−1, 1)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>B<\u002Fsc-raw-td><sc-raw-td>(4, 1)<\u002Fsc-raw-td><sc-raw-td>B’(−1, 4)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>C<\u002Fsc-raw-td><sc-raw-td>(4, 3)<\u002Fsc-raw-td><sc-raw-td>C’(−3, 4)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><\u002Fdiv><\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">O triângulo A’B’C’ fica no 2º quadrante, com o lado A’B’ na vertical, como esperado após girar 90° um triângulo cujo lado AB era horizontal ⇒ alternativa <b>b)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"st\" id=\"anim6\" style=\"margin-top:10px\"><summary>Resolução por animação<\u002Fsummary><div class=\"stb\">\n<p style=\"margin:0 0 10px\">O triângulo ABC (tracejado) gira em torno da origem O, no sentido anti-horário, até completar 90°. A linha vermelha liga O ao vértice B: o ângulo entre a posição inicial e a final é sempre 90°, e cada vértice percorre um arco de circunferência centrada em O.<\u002Fp>\n<svg id=\"rot6\" sc-camel-view-box=\"0 0 360 360\" style=\"display:block;width:100%;max-width:420px;margin:0 auto;background:#fff;border:2px solid var(--color-divider)\">\n<path d=\"M30 15V345M15 330H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"30\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">-5<\u002Ftext><text x=\"175\" y=\"333\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">-5<\u002Ftext><path d=\"M60 15V345M15 300H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"60\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">-4<\u002Ftext><text x=\"175\" y=\"303\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">-4<\u002Ftext><path d=\"M90 15V345M15 270H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"90\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">-3<\u002Ftext><text x=\"175\" y=\"273\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">-3<\u002Ftext><path d=\"M120 15V345M15 240H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"120\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">-2<\u002Ftext><text x=\"175\" y=\"243\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">-2<\u002Ftext><path d=\"M150 15V345M15 210H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"150\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">-1<\u002Ftext><text x=\"175\" y=\"213\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">-1<\u002Ftext><path d=\"M180 15V345M15 180H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><path d=\"M210 15V345M15 150H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"210\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">1<\u002Ftext><text x=\"175\" y=\"153\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">1<\u002Ftext><path d=\"M240 15V345M15 120H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"240\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">2<\u002Ftext><text x=\"175\" y=\"123\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">2<\u002Ftext><path d=\"M270 15V345M15 90H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"270\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">3<\u002Ftext><text x=\"175\" y=\"93\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">3<\u002Ftext><path d=\"M300 15V345M15 60H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"300\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">4<\u002Ftext><text x=\"175\" y=\"63\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">4<\u002Ftext><path d=\"M330 15V345M15 30H345\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fpath><text x=\"330\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#605d5d\">5<\u002Ftext><text x=\"175\" y=\"33\" font-size=\"9\" text-anchor=\"end\" fill=\"#605d5d\">5<\u002Ftext>\n<path d=\"M15 180H345M180 345V15\" stroke=\"#201e1d\" stroke-width=\"1.6\"><\u002Fpath>\n<text x=\"343\" y=\"174\" font-size=\"11\" text-anchor=\"end\" fill=\"#201e1d\" font-style=\"italic\">x<\u002Ftext>\n<text x=\"186\" y=\"25\" font-size=\"11\" fill=\"#201e1d\" font-style=\"italic\">y<\u002Ftext>\n<text x=\"174\" y=\"194\" font-size=\"11\" text-anchor=\"end\" font-weight=\"700\" fill=\"#201e1d\">O<\u002Ftext>\n<path id=\"rot6-trail\" d=\"\" fill=\"none\" stroke=\"#ec3013\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"><\u002Fpath>\n<polygon points=\"210,150 300,150 300,90\" fill=\"#b4b2b1\" fill-opacity=\".45\" stroke=\"#605d5d\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"><\u002Fpolygon>\n<text x=\"206\" y=\"164\" font-size=\"12\" font-weight=\"700\" fill=\"#605d5d\" text-anchor=\"end\">A<\u002Ftext><text x=\"306\" y=\"164\" font-size=\"12\" font-weight=\"700\" fill=\"#605d5d\" text-anchor=\"start\">B<\u002Ftext><text x=\"306\" y=\"84\" font-size=\"12\" font-weight=\"700\" fill=\"#605d5d\" text-anchor=\"start\">C<\u002Ftext>\n<path id=\"rot6-arc\" d=\"\" fill=\"none\" stroke=\"#ec3013\" stroke-width=\"2\"><\u002Fpath>\n<line id=\"rot6-ray\" x1=\"180\" y1=\"180\" x2=\"300\" y2=\"150\" stroke=\"#ec3013\" stroke-width=\"1.4\"><\u002Fline>\n<polygon id=\"rot6-tri\" points=\"210,150 300,150 300,90\" fill=\"#ec3013\" fill-opacity=\".28\" stroke=\"#ec3013\" stroke-width=\"2.2\"><\u002Fpolygon>\n<circle id=\"rot6-p0\" cx=\"210\" cy=\"150\" r=\"3.5\" fill=\"#ec3013\"><\u002Fcircle><text id=\"rot6-l0\" x=\"210\" y=\"150\" font-size=\"12\" font-weight=\"700\" fill=\"#a3200b\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\"><\u002Ftext><circle id=\"rot6-p1\" cx=\"300\" cy=\"150\" r=\"3.5\" fill=\"#ec3013\"><\u002Fcircle><text id=\"rot6-l1\" x=\"300\" y=\"150\" font-size=\"12\" font-weight=\"700\" fill=\"#a3200b\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\"><\u002Ftext><circle id=\"rot6-p2\" cx=\"300\" cy=\"90\" r=\"3.5\" fill=\"#ec3013\"><\u002Fcircle><text id=\"rot6-l2\" x=\"300\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#a3200b\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\"><\u002Ftext>\n<text id=\"rot6-ang\" x=\"188\" y=\"172\" font-size=\"12\" font-weight=\"700\" fill=\"#a3200b\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">0°<\u002Ftext>\n<\u002Fsvg>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 8px\">\n<button type=\"button\" id=\"rot6-play\" style=\"min-height:44px;padding:0 20px;border:0;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:14px;cursor:pointer;text-align:left\">▶ Iniciar<\u002Fbutton>\n<button type=\"button\" id=\"rot6-reset\" style=\"min-height:44px;padding:0 20px;border:2px solid var(--color-text);background:transparent;color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:14px;cursor:pointer;text-align:left\">↺ Reiniciar<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"rot6-out\" style=\"font-family:var(--font-heading);font-size:13px;text-align:center;line-height:1.6;min-height:42px\">A(1, 1) · B(4, 1) · C(4, 3)<\u002Fdiv>\n<\u002Fdiv><\u002Fdetails>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">a é a rotação de 90° no sentido horário, (x, y) → (y, −x); c é a reflexão no eixo y; d é a rotação de 180°; e apenas troca as coordenadas (reflexão na reta y = x).<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 07<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: C<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">Em um curso técnico, a nota final de cada disciplina é a média ponderada de três avaliações. Para ser aprovado, o estudante precisa obter nota final mínima de 7,0. Os pesos das avaliações e as notas de um estudante estão no quadro a seguir.<\u002Fp><div style=\"display:flex;justify-content:center\"><div style=\"overflow-x:auto\"><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Avaliação<\u002Fsc-raw-th><sc-raw-th>Nota<\u002Fsc-raw-th><sc-raw-th>Peso<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>P1<\u002Fsc-raw-td><sc-raw-td>6,0<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>P2<\u002Fsc-raw-td><sc-raw-td>6,5<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>P3<\u002Fsc-raw-td><sc-raw-td>?<\u002Fsc-raw-td><sc-raw-td>5<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><\u002Fdiv><\u002Fdiv><p class=\"en\">Qual é a nota mínima que esse estudante precisa obter na P3 para ser aprovado?<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 7,0<\u002Fdiv><div><b>b)<\u002Fb> 7,5<\u002Fdiv><div><b>c)<\u002Fb> 7,7<\u002Fdiv><div><b>d)<\u002Fb> 8,0<\u002Fdiv><div><b>e)<\u002Fb> 8,5<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Nota final: NF = (2 · P1 + 3 · P2 + 5 · P3) ÷ (2 + 3 + 5).<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">Impondo NF ≥ 7,0: (2 · 6,0 + 3 · 6,5 + 5 · P3) ÷ 10 ≥ 7,0.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">12 + 19,5 + 5 · P3 ≥ 70 ⇒ 5 · P3 ≥ 38,5.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">P3 ≥ <b>7,7<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">8,5 (alternativa e) é o resultado com média aritmética simples, ignorando os pesos: (6,0 + 6,5 + P3) ÷ 3 = 7,0.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div class=\"q\">\n<div class=\"qh\"><h2>Questão 08<\u002Fh2><details class=\"gab\"><summary>Ver resposta<\u002Fsummary><span>Gabarito: D<\u002Fspan><\u002Fdetails><\u002Fdiv>\n<p class=\"en\">A professora de Língua Portuguesa registrou a quantidade de livros lidos, no último mês, pelos 20 estudantes de uma turma. Os dados foram organizados no gráfico a seguir.<\u002Fp><img class=\"fig\" src=\"75da187d-fc12-4de8-b5c2-8013cd245fb5\" alt=\"Gráfico de barras: 0 livros – 2 estudantes; 1 – 5; 2 – 6; 3 – 4; 4 – 3\" style=\"width:420px\"><p class=\"en\">A média e a mediana da quantidade de livros lidos por esses estudantes são, respectivamente,<\u002Fp><div class=\"alts\"><div><b>a)<\u002Fb> 2 e 2.<\u002Fdiv><div><b>b)<\u002Fb> 2 e 2,05.<\u002Fdiv><div><b>c)<\u002Fb> 2,05 e 2,5.<\u002Fdiv><div><b>d)<\u002Fb> 2,05 e 2.<\u002Fdiv><div><b>e)<\u002Fb> 2,5 e 2.<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\">Resolução — clique em cada passo<\u002Fdiv>\n<div class=\"steps\">\n<details class=\"st\"><summary>Passo 1<\u002Fsummary><div class=\"stb\">Média: multiplique cada valor pela sua frequência e divida pelo total de estudantes.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 2<\u002Fsummary><div class=\"stb\">x̄ = (0 · 2 + 1 · 5 + 2 · 6 + 3 · 4 + 4 · 3) ÷ 20 = (0 + 5 + 12 + 12 + 12) ÷ 20 = 41 ÷ 20 = <b>2,05<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 3<\u002Fsummary><div class=\"stb\">Mediana: com 20 dados (quantidade par), é a média do 10º e do 11º valores do rol. Use as frequências acumuladas:<div style=\"overflow-x:auto\"><sc-raw-table class=\"t\"><sc-raw-tr><sc-raw-th>Livros<\u002Fsc-raw-th><sc-raw-th>Frequência<\u002Fsc-raw-th><sc-raw-th>Freq. acumulada<\u002Fsc-raw-th><sc-raw-th>Posições<\u002Fsc-raw-th><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>0<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>1ª a 2ª<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>3ª a 7ª<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td>8ª a 13ª<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>17<\u002Fsc-raw-td><sc-raw-td>14ª a 17ª<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>20<\u002Fsc-raw-td><sc-raw-td>18ª a 20ª<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-table><\u002Fdiv><\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 4<\u002Fsummary><div class=\"stb\">O 10º e o 11º valores estão entre a 8ª e a 13ª posição ⇒ ambos valem 2. Mediana = (2 + 2) ÷ 2 = <b>2<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<details class=\"st\"><summary>Passo 5<\u002Fsummary><div class=\"stb\">Média 2,05 e mediana 2 ⇒ alternativa <b>d)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<details class=\"trap\"><summary>Cuidado com a armadilha<\u002Fsummary><div class=\"stb\">a (2 e 2) aparece ao tomar a moda como média; a média 2,5 vem de calcular (0 + 1 + 2 + 3 + 4) ÷ 5 sem considerar as frequências.<\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<div style=\"border-top:2px solid var(--color-divider);margin-top:26px;padding-top:12px;break-inside:avoid\">\n<details class=\"fg\"><summary>Mostrar gabarito completo<\u002Fsummary>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));border:2px solid var(--color-divider);font-family:var(--font-heading);text-align:left\">\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">01<\u002Fdiv><b>C<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">02<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">03<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">04<\u002Fdiv><b>E<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">05<\u002Fdiv><b>A<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">06<\u002Fdiv><b>B<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">07<\u002Fdiv><b>C<\u002Fb><\u002Fdiv>\n<div style=\"padding:6px 8px;border-right:1px solid var(--color-neutral-300);border-bottom:1px solid var(--color-neutral-300)\"><div style=\"font-size:10px;color:var(--color-neutral-700)\">08<\u002Fdiv><b>D<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
