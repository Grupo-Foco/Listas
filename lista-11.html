document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"ce32b9d8-0bbd-40b7-8050-345516b80f51\"><\u002Fscript>\n<title>Lista 11 — Potência de ponto | 1º ano<\u002Ftitle>\n<style>\n  :root {\n    --color-accent: #309898;\n    --color-accent-100: #e6f2f2;\n    --color-accent-200: #c7e5e4;\n    --color-accent-300: #9fd2d1;\n    --color-accent-400: #63b5b4;\n    --color-accent-500: #309898;\n    --color-accent-600: #2a8686;\n    --color-accent-700: #1f6a6b;\n    --color-accent-800: #17504f;\n    --color-accent-900: #0f3737;\n    --color-accent-2: #309898;\n    --color-accent-2-500: #309898;\n    --color-accent-2-700: #1f6a6b;\n  }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); }\n  ::selection { background: var(--color-accent-200); }\n  video { display: block; width: 100%; height: auto; background: var(--color-neutral-900) }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"max-width: 1000px; margin: 0 auto; padding: clamp(24px, 5vw, 56px) clamp(18px, 5vw, 56px) 88px; font-family: var(--font-body); font-size: 19px; line-height: 1.55; text-wrap: pretty\">\n\n  <header style=\"display: flex; flex-direction: column; gap: 22px; border-bottom: 2px solid var(--color-divider); padding-bottom: 32px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px\">\n      <div style=\"display: flex; align-items: center; gap: 18px\">\n        <img src=\"ad4a7da3-d050-415a-a9a2-4b68b08424ba\" alt=\"Arena — Educação Infantil e Ensino Fundamental\" style=\"width: 64px; height: 64px; display: block\">\n        <div style=\"line-height: 1.25\">\n          <div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; letter-spacing: -0.01em\">Arena<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--color-neutral-700)\">Ensino Médio<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"index.html\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 2px solid var(--color-divider); font-size: 16px; font-weight: 600; color: var(--color-accent-700)\">Todas as listas<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">\n      <span>Lista 11 · M.P. V (Matemática)<\u002Fspan>\n      <span style=\"color: var(--color-neutral-700)\">Prof. Rodolfo Pinheiro<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 9vw, 66px); line-height: 0.99; letter-spacing: -0.025em; margin: 0; margin-left: -0.05em\">Potência de ponto<\u002Fh1>\n    <p style=\"margin: 0; font-size: clamp(18px, 4.4vw, 22px); line-height: 1.35; max-width: 46ch\">Resolva na lista impressa ou no caderno. Aqui você confere — mas peça um passo de cada vez, não a resposta pronta.<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"margin-top: 40px; border: 2px solid var(--color-divider); padding: clamp(20px, 4vw, 30px)\">\n    <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">Antes de começar<\u002Fdiv>\n    <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 5.5vw, 32px); line-height: 1.1; letter-spacing: -0.02em; margin: 12px 0 0\">Os três casos, numa ideia só<\u002Fh2>\n    <p style=\"margin: 14px 0 0; font-size: 18px; line-height: 1.5; max-width: 66ch\">Todo ponto tem uma <strong style=\"font-weight: 600\">potência<\u002Fstrong> em relação a uma circunferência: um número que sai igual por qualquer reta que você tracer passando por ele. Os três teoremas abaixo são o mesmo fato, escrito de três jeitos.<\u002Fp>\n\n    <div style=\"margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 32px\">\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 18px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; margin: 0; line-height: 1.15\">Duas cordas<\u002Fh3>\n        <figure style=\"margin: 14px 0 0; border: 2px solid var(--color-divider); padding: 10px; background: #ffffff\">\n          <img src=\"aeaf898f-7806-49ec-be67-b86ba03ceb56\" alt=\"Duas cordas AB e CD que se cruzam no ponto P dentro da circunferência\" style=\"display: block; width: 100%; height: auto\">\n        <\u002Ffigure>\n        <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.45\">P dentro: os pedaços de uma corda multiplicados dão o mesmo que os da outra.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 19px\">PA · PB = PC · PD<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 18px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; margin: 0; line-height: 1.15\">Duas secantes<\u002Fh3>\n        <figure style=\"margin: 14px 0 0; border: 2px solid var(--color-divider); padding: 10px; background: #ffffff\">\n          <img src=\"5c22c336-c403-4d9a-8015-78f54bbe49a0\" alt=\"Duas retas secantes traçadas a partir de um ponto P externo à circunferência\" style=\"display: block; width: 100%; height: auto\">\n        <\u002Ffigure>\n        <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.45\">P fora: em cada secante, multiplique o pedaço de fora pela secante inteira.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 19px\">PA · PB = PC · PD<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 18px\">\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; margin: 0; line-height: 1.15\">Secante e tangente<\u002Fh3>\n        <figure style=\"margin: 14px 0 0; border: 2px solid var(--color-divider); padding: 10px; background: #ffffff\">\n          <img src=\"ccb15f14-4936-4c0c-9c5c-258418287c37\" alt=\"Uma reta secante e uma reta tangente traçadas a partir de um ponto P externo\" style=\"display: block; width: 100%; height: auto\">\n        <\u002Ffigure>\n        <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.45\">A tangente é o caso-limite da secante: os dois pontos viram um só, então o produto vira quadrado.<\u002Fp>\n        <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 600; font-size: 19px\">PT² = PA · PB<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 28px 0 0; font-size: 18px; background: var(--color-accent-100); color: var(--color-accent-900); padding: 18px 22px; max-width: 78ch\"><strong style=\"font-weight: 600\">O atalho que resolve metade da lista:<\u002Fstrong> se você souber a distância d do ponto até o centro e o raio r, a potência é d² − r². Para P fora, ela vale PT². Guarde: <strong style=\"font-weight: 600\">PT² = d² − r²<\u002Fstrong>.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"margin-top: 40px; border: 2px solid var(--color-divider); padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px\">\n    <div style=\"flex: 1; min-width: 220px\">\n      <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Seu progresso<\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15\">{{ progressoTexto }}<\u002Fp>\n      <div style=\"margin-top: 12px; height: 16px; background: var(--color-neutral-200)\"><div style=\"{{ barraProgresso }}\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn btn-ghost\" style=\"font-size: 16px; color: var(--color-accent-700); min-height: 48px\" sc-camel-on-click=\"{{ limpar }}\">Limpar minhas marcações<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: 44px; display: flex; flex-direction: column; gap: 56px\">\n    <sc-for list=\"{{ questoes }}\" as=\"q\" hint-placeholder-count=\"10\">\n      <article style=\"{{ q.moldura }}\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px\">\n          <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; color: var(--color-accent-700)\">{{ q.n }}<\u002Fspan>\n          <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">{{ q.assunto }}<\u002Fspan>\n          <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">{{ q.origem }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <p style=\"margin: 16px 0 0; font-size: clamp(18px, 4.4vw, 20px); line-height: 1.5; max-width: 68ch\">{{ q.enunciado }}<\u002Fp>\n\n        <sc-if value=\"{{ q.temFigura }}\" hint-placeholder-val=\"{{ false }}\">\n          <figure style=\"margin: 22px 0 0; border: 2px solid var(--color-divider); padding: 16px; background: #ffffff\">\n            <img src=\"{{ q.figura }}\" alt=\"{{ q.figuraAlt }}\" style=\"display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto\">\n          <\u002Ffigure>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ q.temAlternativas }}\" hint-placeholder-val=\"{{ false }}\">\n          <ul style=\"margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 28px; max-width: 64ch\">\n            <sc-for list=\"{{ q.alternativas }}\" as=\"alt\" hint-placeholder-count=\"4\">\n              <li style=\"font-size: 18px; line-height: 1.45\">{{ alt.texto }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 20px\">\n          <div style=\"flex: 1; min-width: 220px\">\n            <label for=\"{{ q.idCampo }}\" style=\"display: block; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Sua resposta<\u002Flabel>\n            <input class=\"input\" id=\"{{ q.idCampo }}\" type=\"text\" value=\"{{ q.resposta }}\" sc-camel-on-change=\"{{ q.anotar }}\" placeholder=\"anote aqui antes de conferir\" style=\"margin-top: 8px; width: 100%; min-height: 52px; font-size: 18px\">\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 20px\" sc-camel-on-click=\"{{ q.marcar }}\">{{ q.rotuloFeita }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 24px; border-top: 2px solid var(--color-divider); padding-top: 20px\">\n          <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600\">Resolução<\u002Fdiv>\n\n          <sc-if value=\"{{ q.semResolucao }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 12px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 62ch\">{{ q.avisoPendente }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ q.nadaAberto }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin: 12px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 62ch\">Tentou de verdade? Então peça uma dica de cada vez — é assim que a resolução ensina alguma coisa.<\u002Fp>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ q.passosVisiveis }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <div style=\"margin-top: 18px; display: flex; gap: 16px; align-items: baseline\">\n              <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 16px; color: var(--color-accent-700); flex: none\">{{ p.n }}<\u002Fspan>\n              <p style=\"margin: 0; font-size: 18px; line-height: 1.5; max-width: 66ch\">{{ p.texto }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ q.terminou }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 20px 0 0; font-size: 18px; font-weight: 600; background: var(--color-accent-100); color: var(--color-accent-900); padding: 16px 20px; max-width: 66ch\">Resposta: {{ q.gabarito }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px\">\n            <sc-if value=\"{{ q.temMaisPassos }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-primary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ q.umPasso }}\">{{ q.rotuloPasso }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ q.temMaisPassos }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ q.tudo }}\">Ver resolução completa<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ q.terminou }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"btn btn-ghost\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px; color: var(--color-accent-700)\" sc-camel-on-click=\"{{ q.esconder }}\">Esconder de novo<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ q.mostrarExtras }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 24px; display: flex; flex-direction: column; gap: 20px\">\n              <sc-if value=\"{{ q.temVideo }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Resolução em vídeo<\u002Fdiv>\n                  <figure style=\"margin: 12px 0 0; border: 2px solid var(--color-text)\">\n                    <video controls=\"\" preload=\"none\" playsinline=\"\" src=\"{{ q.video }}\"><\u002Fvideo>\n                  <\u002Ffigure>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ q.temFoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 600\">Resolução no papel<\u002Fdiv>\n                  <figure style=\"margin: 12px 0 0; border: 2px solid var(--color-divider); padding: 12px; background: #ffffff\">\n                    <img src=\"{{ q.foto }}\" alt=\"Resolução manuscrita da questão {{ q.n }}\" style=\"display: block; width: 100%; height: auto\">\n                  <\u002Ffigure>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <section style=\"margin-top: 72px; border-top: 2px solid var(--color-text); padding-top: 28px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px 24px\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.1; letter-spacing: -0.02em; margin: 0\">Gabarito<\u002Fh2>\n      <button class=\"btn btn-secondary\" style=\"min-height: 52px; font-size: 16px; padding: 0 22px\" sc-camel-on-click=\"{{ alternarGabarito }}\">{{ rotuloGabarito }}<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin: 14px 0 0; font-size: 17px; color: var(--color-neutral-700); max-width: 60ch\">Só as respostas finais, para conferir de uma vez. As resoluções ficam em cada questão.<\u002Fp>\n\n    <sc-if value=\"{{ gabaritoAberto }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-raw-table class=\"table\" style=\"margin-top: 24px; max-width: 700px; font-size: 18px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Questão<\u002Fsc-raw-th><sc-raw-th>Resposta<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ questoes }}\" as=\"q\" hint-placeholder-count=\"10\">\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600\">{{ q.n }}<\u002Fsc-raw-td><sc-raw-td>{{ q.gabarito }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <footer style=\"margin-top: 72px; border-top: 2px solid var(--color-divider); padding-top: 28px; font-size: 16px; color: var(--color-neutral-700)\">\n    <p style=\"margin: 0\">Material produzido pelo <strong style=\"font-weight: 600\">Prof. Rodolfo C Pinheiro<\u002Fstrong> para a Arena — Educação Infantil e Ensino Fundamental.<\u002Fp>\n    <p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5\">Questões autorais e adaptadas de FICSAE-SP e Famema-SP; a origem está indicada em cada uma. Suas anotações ficam salvas apenas neste aparelho.<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\n/* ─────────────────────────────────────────────────────────────────────────\n   LISTA 11 — POTÊNCIA DE PONTO\n\n   Campos de cada questão: numero, assunto, origem, enunciado, figura,\n   figuraAlt, alternativas, passos, gabarito, video, foto.\n   Deixe `passos` vazio ([]) para publicar sem resolução, com um `pendent     ],\n    gabarito: \"x = 3\"\n  },\n  {\n    numero: \"1b\", assunto: \"Secantes e tangente\", origem: \"Autoral\",\n    enunciado: \"Determine as medidas x e y indicadas na figura, traçadas a partir de um ponto P externo à circunferência.\",\n    figura: \"fig-l11-q1b.png\", figuraAlt: \"Ponto P externo com duas secantes de medidas 4 e 5, 2 e x, e uma tangente y\",\n    passos: [\n      \"Todas as retas partem do mesmo ponto P, então todas têm a mesma potência. Calcule essa potência uma vez e use nas outras duas.\",\n      \"Comece pela secante que está completa: o pedaço de fora mede 4 e a corda mede 5, então a secante inteira mede 4 + 5 = 9.\",\n      \"Potência de P = 4 · 9 = 36. Esse número vale para qualquer reta traçada de P.\",\n      \"Na segunda secante, o pedaço de fora é 2 e a inteira é 2 + x: então 2 · (2 + x) = 36, logo 2 + x = 18 e x = 16.\",\n      \"A terceira reta é tangente, e aí o produto vira quadrado: y² = 36, portanto y = 6.\"\n    ],\n    gabarito: \"x = 16 e y = 6\"\n  },\n  {\n    numero: \"2\", assunto: \"Teorema das cordas\", origem: \"Autoral\",\n    enunciado: \"Dadas as cordas AC e BD que se cortam no ponto P no interior da circunferência representada a seguir, determine a medida de AC.\",\n    figura: \"fig-l11-q2.png\", figuraAlt: \"Cordas cruzadas com segmentos x, x+3, 3x e x−1\",\n    passos: [\n      \"Aplique o teorema das cordas com as expressões da figura: AP · PC = DP · PB, ou seja, x · (x + 3) = 3x · (x − 1).\",\n      \"Abra os dois lados: x² + 3x = 3x² − 3x.\",\n      \"Passe tudo para um lado: 0 = 3x² − 3x − x² − 3x = 2x² − 6x.\",\n      \"Fatore: 2x(x − 3) = 0. As raízes são x = 0 e x = 3 — e x = 0 não serve, porque um segmento não pode ter medida nula.\",\n      \"Com x = 3: AP = 3 e PC = 3 + 3 = 6.\",\n      \"A pergunta é AC, que é a corda inteira: AC = AP + PC = 3 + 6 = 9.\"\n    ],\n    gabarito: \"AC = 9\"\n  },\n  {\n    numero: \"3\", assunto: \"Corda e diâmetro\", origem: \"Autoral\",\n    enunciado: \"Na circunferência de centro O a seguir, o diâmetro AB e a corda CD cortam-se em um ponto P tal que CP = ½ · PD e AP = ½ · PO. Sendo r o raio da circunferência, determine a medida de PD em função do raio.\",\n    figura: \"fig-l11-q3.png\", figuraAlt: \"Circunferência de centro O com o diâmetro AB cortando a corda CD no ponto P\",\n    passos: [\n      \"Sem números, a saída é escrever tudo em função de r. Comece pelo diâmetro: de A até o centro O a distância é o raio, então AP + PO = r.\",\n      \"O enunciado diz AP = ½ · PO. Substitua: ½PO + PO = r, ou seja, 1,5 · PO = r.\",\n      \"Daí PO = 2r/3 e AP = r/3.\",\n      \"Falta PB, o outro pedaço do diâmetro: PB = PO + OB = 2r/3 + r = 5r/3.\",\n      \"Agora o teorema das cordas: AP · PB = CP · PD. Como CP = PD/2, o lado direito é (PD/2) · PD = PD²/2.\",\n      \"Substitua o lado esquerdo: (r/3) · (5r/3) = 5r²/9. Então PD²/2 = 5r²/9, logo PD² = 10r²/9.\",\n      \"Extraia a raiz: PD = r√10 / 3.\"\n    ],\n    gabarito: \"PD = r√10/3\"\n  },\n  {\n    numero: \"4\", assunto: \"Potência e distância ao centro\", origem: \"Autoral\",\n    enunciado: \"Dadas a circunferência de centro O e raio r, bem como as retas secantes e tangente a ela, conforme a figura a seguir, determine a medida de x e do raio r.\",\n    figura: \"fig-l11-q4.png\", figuraAlt: \"Ponto P externo com secante de medidas 4 e 5, tangente x, e distância 10 até o centro O\",\n    passos: [\n      \"Comece pela secante, que é a única reta com as duas medidas dadas: o pedaço externo mede 4 e a corda mede 5, então a secante inteira mede 9.\",\n      \"Potência de P = 4 · 9 = 36.\",\n      \"A reta que toca a circunferência em E é tangente, e para tangente o produto vira quadrado: x² = 36, logo x = 6.\",\n      \"Para o raio, use o atalho: a potência de um ponto externo também vale d² − r², em que d é a distância de P até o centro.\",\n      \"Aqui d = PO = 10, então 36 = 10² − r², ou seja, 36 = 100 − r².\",\n      \"r² = 64 e r = 8.\"\n    ],\n    gabarito: \"x = 6 e r = 8\"\n  },\n  {\n    numero: \"5\", assunto: \"Tangente e corda\", origem: \"Autoral\",\n    enunciado: \"Na figura a seguir, fora de escala, O é o centro da circunferência de raio r e PT é um segmento tangente a ela. Determine a medida do raio r dessa circunferência.\",\n    figura: \"fig-l11-q5.png\", figuraAlt: \"Circunferência de centro O com tangente PT igual a 12, secante com 8 e 9, e distância 5 de O ao ponto B\",\n    passos: [\n      \"Duas retas saem de P: a tangente PT = 12 e a secante que passa por A e C. Iguale as potências.\",\n      \"PT² = PA · PC → 144 = 8 · PC, logo PC = 18.\",\n      \"Agora ache o pedaço que falta na secante. PB = PA + AB = 8 + 9 = 17, e como PC = 18, sobra BC = 18 − 17 = 1.\",\n      \"Repare que B é onde a corda CA cruza o diâmetro que passa por O. Isso pede o teorema das cordas aplicado em B.\",\n      \"Os pedaços do diâmetro medem r − 5 e r + 5, porque a figura dá OB = 5 e o raio é r. Os pedaços da outra corda são BA = 9 e BC = 1.\",\n      \"Monte: 9 · 1 = (r − 5) · (r + 5), ou seja, 9 = r² − 25.\",\n      \"r² = 34, portanto r = √34.\"\n    ],\n    gabarito: \"r = √34\"\n  },\n  {\n    numero: \"6\", assunto: \"Duas circunferências\", origem: \"Autoral\",\n    enunciado: \"Se PT e PS são tangentes às circunferências apresentadas, PT = 6 cm e PA = 4 cm, determine as medidas AB e PS.\",\n    figura: \"fig-l11-q6.png\", figuraAlt: \"Duas circunferências com tangentes PT e PS a partir do ponto P, e a reta que passa por A e B\",\n    passos: [\n      \"O ponto P é externo às duas circunferências, e a reta que passa por A e B corta as duas. Essa reta é a ponte entre elas.\",\n      \"Na primeira circunferência, PT é tangente: PT² = PA · PB → 36 = 4 · PB, logo PB = 9.\",\n      \"Como PB = PA + AB, temos 9 = 4 + AB, portanto AB = 5 cm.\",\n      \"Na segunda circunferência, a mesma reta entra em A e sai em B, então a potência de P vale PA · PB = 4 · 9 = 36.\",\n      \"PS é tangente a essa segunda circunferência: PS² = 36, logo PS = 6 cm.\",\n      \"Não é coincidência PS = PT: quando a mesma secante serve às duas, as tangentes saem iguais.\"\n    ],\n    gabarito: \"AB = 5 cm e PS = 6 cm\"\n  },\n  {\n    numero: \"7\", assunto: \"Potência pelo centro\", origem: \"Autoral\",\n    enunciado: \"A circunferência de centro O tem raio medindo 5 cm. Os segmentos AB, BC e AD medem, respectivamente, 5 cm, y cm e 4 cm. Determine a medida y.\",\n    figura: \"fig-l11-q7.png\", figuraAlt: \"Circunferência de centro O com uma reta por A passando pelo centro e outra cortando em B e C\",\n    passos: [\n      \"A reta que sai de A e passa pelo centro é a chave: nela dá para achar a distância de A até O.\",\n      \"AD = 4 é o pedaço de fora, de A até o ponto D da circunferência, e de D até O há mais um raio: AO = 4 + 5 = 9 cm.\",\n      \"Use o atalho da potência: potência de A = AO² − r² = 9² − 5² = 81 − 25 = 56.\",\n      \"Na outra reta, que corta a circunferência em B e depois em C, vale AB · AC = 56.\",\n      \"AB = 5 e AC = AB + BC = 5 + y. Então 5 · (5 + y) = 56.\",\n      \"5 + y = 11,2, portanto y = 6,2 cm.\"\n    ],\n    gabarito: \"y = 6,2 cm\"\n  },\n  {\n    numero: \"8\", assunto: \"Triângulo e circunferência\", origem: \"FICSAE-SP\",\n    enunciado: \"Uma circunferência tangencia o lado BC de um triângulo ABC no ponto F e intersecta os lados AB e AC desse triângulo nos pontos E e D, respectivamente, conforme mostra a figura. Sabendo que essa circunferência passa pelo ponto A, a distância entre os pontos D e E, em cm, é igual a\",\n    figura: \"fig-l11-q8.png\", figuraAlt: \"Triângulo ABC com circunferência passando por A, E e D e tangente a BC em F, com BE=4, BF=8, CF=6 e CD=4\",\n    alternativas: [\"a) 10,5\", \"b) 10,9\", \"c) 11,3\", \"d) 11,7\"],\n    passos: [\n      \"Trabalhe um vértice de cada vez. Comece por B: dele saem a tangente BF e a secante que passa por E e A.\",\n      \"BF² = BE · BA → 8² = 4 · BA → 64 = 4 · BA, logo BA = 16 cm. Daí AE = 16 − 4 = 12 cm.\",\n      \"Agora o vértice C, do mesmo jeito: CF² = CD · CA → 6² = 4 · CA → CA = 9 cm. Daí AD = 9 − 4 = 5 cm.\",\n      \"Também dá para fechar o lado BC: BC = BF + FC = 8 + 6 = 14 cm.\",\n      \"Repare que os triângulos ABC e AED compartilham o ângulo A. Então basta achar o cosseno desse ângulo no triângulo grande e usá-lo no pequeno.\",\n      \"No triângulo ABC (lados 16, 9 e 14), pela lei dos cossenos: 14² = 16² + 9² − 2 · 16 · 9 · cos A → 196 = 337 − 288 · cos A, logo cos A = 141/288 ≈ 0,49.\",\n      \"No triângulo AED (lados AE = 12 e AD = 5): DE² = 12² + 5² − 2 · 12 · 5 · 0,49 = 169 − 58,75 ≈ 110,25.\",\n      \"DE ≈ 10,5 cm.\"\n    ],\n    gabarito: \"a) 10,5 cm\"\n  },\n  {\n    numero: \"9\", assunto: \"Corda perpendicular\", origem: \"Famema-SP\",\n    enunciado: \"A figura a seguir mostra uma parte de uma circunferência, uma corda AB e um segmento CD perpendicular a AB. Sabe-se que AD = 4, DB = 6 e CD = 2. O raio dessa circunferência mede\",\n    figura: \"fig-l11-q9.png\", figuraAlt: \"Arco de circunferência com a corda AB e o segmento CD perpendicular a ela\",\n    alternativas: [\"a) √42\", \"b) √46\", \"c) √50\", \"d) √54\", \"e) √58\"],\n    passos: [\n      \"O truque é enxergar a segunda corda: prolongue CD para o outro lado até tocar a circunferência num ponto E. Agora são duas cordas se cruzando em D.\",\n      \"Teorema das cordas em D: CD · DE = AD · DB → 2 · DE = 4 · 6 = 24, logo DE = 12.\",\n      \"Ponha coordenadas para facilitar: D na origem, com AB na horizontal. Então A(−4, 0), B(6, 0), C(0, 2) e E(0, −12).\",\n      \"O centro fica na mediatriz de AB, que é a reta vertical x = (−4 + 6)/2 = 1.\",\n      \"O centro também fica na mediatriz de CE, que é a reta horizontal y = (2 − 12)/2 = −5. Logo o centro é o ponto (1, −5).\",\n      \"O raio é a distância do centro até A(−4, 0): r² = (1 + 4)² + (−5 − 0)² = 25 + 25 = 50.\",\n      \"r = √50.\"\n    ],\n    gabarito: \"c) √50\"\n  }\n];\n\nclass Component extends DCLogic {\n  state = { passos: {}, feitas: {}, respostas: {}, gabarito: false };\n\n  componentDidMount() {\n    try {\n      const salvo = JSON.parse(window.localStorage.getItem(LISTA) || \"{}\");\n      this.setState({ feitas: salvo.feitas || {}, respostas: salvo.respostas || {} });\n    } catch (e) { /* primeira visita, ou navegador sem armazenamento */ }\n  }\n\n  gravar(feitas, respostas) {\n    try {\n      window.localStorage.setItem(LISTA, JSON.stringify({ feitas, respostas }));\n    } catch (e) { /* segue sem gravar */ }\n  }\n\n  marcar(i) {\n    this.setState((s) => {\n      const feitas = { ...s.feitas, [i]: !s.feitas[i] };\n      this.gravar(feitas, s.respostas);\n      return { feitas };\n    });\n  }\n\n  anotar(i, texto) {\n    this.setState((s) => {\n      const respostas = { ...s.respostas, [i]: texto };\n      this.gravar(s.feitas, respostas);\n      return { respostas };\n    });\n  }\n\n  verPassos(i, quantos) {\n    this.setState((s) => ({ passos: { ...s.passos, [i]: quantos } }));\n  }\n\n  renderVals() {\n    const { passos, feitas, respostas, gabarito } = this.state;\n\n    const questoes = QUESTOES.map((q, i) => {\n      const total = q.passos.length;\n      const semResolucao = total === 0;\n      const abertos = passos[i] || 0;\n      const terminou = !semResolucao && abertos >= total;\n      const feita = !!feitas[i];\n      return {\n        n: q.numero,\n        assunto: q.assunto,\n        origem: q.origem,\n        enunciado: q.enunciado,\n        moldura: {\n          borderTop: feita ? \"2px solid var(--color-accent)\" : \"2px solid var(--color-text)\",\n          paddingTop: \"22px\",\n          background: feita ? \"var(--color-accent-100)\" : \"transparent\",\n          paddingLeft: feita ? \"20px\" : \"0\",\n          paddingRight: feita ? \"20px\" : \"0\",\n          paddingBottom: feita ? \"22px\" : \"0\"\n        },\n        temFigura: !!q.figura,\n        figura: FIGURAS[q.figura] || q.figura || \"\",\n        figuraAlt: q.figuraAlt || \"Figura da questão\",\n        temAlternativas: !!(q.alternativas && q.alternativas.length),\n        alternativas: (q.alternativas || []).map((t) => ({ texto: t })),\n        idCampo: \"resposta-\" + i,\n        resposta: respostas[i] || \"\",\n        anotar: (ev) => this.anotar(i, ev.target.value),\n        marcar: () => this.marcar(i),\n        rotuloFeita: feita ? \"✓ Já fiz\" : \"Marcar como feita\",\n        passosVisiveis: q.passos.slice(0, abertos).map((t, j) => ({\n          n: \"Passo \" + (j + 1),\n          texto: t\n        })),\n        semResolucao,\n        avisoPendente: q.pendente || \"\",\n        nadaAberto: !semResolucao && abertos === 0,\n        temMaisPassos: !semResolucao && !terminou,\n        terminou,\n        mostrarExtras: terminou,\n        rotuloPasso: abertos === 0 ? \"Ver o primeiro passo\" : \"Ver o próximo passo\",\n        umPasso: () => this.verPassos(i, abertos + 1),\n        tudo: () => this.verPassos(i, total),\n        esconder: () => this.verPassos(i, 0),\n        gabarito: q.gabarito,\n        temVideo: !!q.video,\n        video: q.video || \"\",\n        temFoto: !!q.foto,\n        foto: FIGURAS[q.foto] || q.foto || \"\"\n      };\n    });\n\n    const feitasQtd = QUESTOES.filter((_, i) => feitas[i]).length;\n\n    return {\n      questoes,\n      progressoTexto: feitasQtd === 0\n        ? \"Nenhuma questão marcada ainda\"\n        : feitasQtd + \" de \" + QUESTOES.length + \" questões feitas\",\n      barraProgresso: {\n        width: Math.max(2, (feitasQtd / QUESTOES.length) * 100) + \"%\",\n        height: \"16px\",\n        background: \"var(--color-accent)\"\n      },\n      limpar: () => {\n        this.setState({ feitas: {}, respostas: {}, passos: {} });\n        this.gravar({}, {});\n      },\n      gabaritoAberto: gabarito,\n      rotuloGabarito: gabarito ? \"Esconder gabarito\" : \"Mostrar gabarito\",\n      alternarGabarito: () => this.setState((s) => ({ gabarito: !s.gabarito }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
